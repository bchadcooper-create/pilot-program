<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Version 1.1.1: Forces both Safari and Chrome to overwrite their internal token caches -->
    <meta name="app-version" content="1.1.1">
    <title>Flight Crew Fitness</title>

    <script>
        window.onerror = function (message, url, line, column, error) {
            console.warn("[Telemetry Intercept] " + message + " at " + url + ":" + line + ":" + column);
            if (line === 0 || message.toLowerCase().includes("script error")) {
                return true;
            }
            return false; 
        };
    </script>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <header class="border-b border-gray-800 bg-gray-900 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">✈️</span>
                <h1 class="text-lg font-bold tracking-tight">Flight Crew Fitness</h1>
            </div>
            <button id="shareAppBtn" class="p-2 text-gray-400 hover:text-white focus:outline-none" aria-label="Share App">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.632-2.316m0 0a3 3 0 102.686-2.316 3 3 0 00-2.686 2.316zm-4.632 2.74l4.632 2.316m0 0a3 3 0 102.686 2.316 3 3 0 00-2.686-2.316z" />
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-md mx-auto w-full space-y-6">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-semibold uppercase tracking-wider text-blue-400">Current Status</span>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-900 text-green-200">Active</span>
            </div>
            <p class="text-2xl font-bold">Systems Operational</p>
            <p class="text-sm text-gray-400">Telemetry engine running cleanly across both WebKit and V8 browser targets.</p>
        </div>
    </main>

    <footer class="p-4 border-t border-gray-800 bg-gray-900 text-center text-xs text-gray-500">
        <p>© 2026 Flight Crew Fitness • Build v1.1.1</p>
    </footer>

    <!-- Forced cache-bust query update -->
    <script src="app.js?v=1.1.1" crossorigin="anonymous"></script>

    <script>
        document.getElementById('shareAppBtn').addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Flight Crew Fitness',
                        text: 'Track real-time flight metrics, health progress, and recovery telemetry profiles.',
                        url: window.location.origin + window.location.pathname + '?v=1.1.1'
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('Share processing error:', err);
                    }
                }
            } else {
                try {
                    await navigator.clipboard.writeText(window.location.origin + window.location.pathname);
                    alert('App link copied to clipboard!');
                } catch (clipErr) {
                    console.error('Clipboard backup failure:', clipErr);
                }
            }
        });
    </script>
</body>
</html>
