<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Flight Crew Fitness</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .tab-active { color: #3b82f6; border-top: 2px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <main id="app" class="p-4 max-w-md mx-auto mb-20">
        <div id="view-dashboard">
            <h2 class="text-xl font-bold mb-4">Preflight Briefing</h2>
            <select id="gymEnv" class="w-full bg-gray-800 p-3 rounded mb-4 border border-gray-700">
                <option value="room">Hotel Room (Minimal)</option>
                <option value="hotel">Hotel Gym (Variable)</option>
                <option value="comm">Commercial Gym (Full)</option>
            </select>
            <input type="number" id="blockHours" placeholder="Flight Hours" class="w-full bg-gray-800 p-3 rounded mb-2 border border-gray-700">
            <input type="number" id="waterCleared" placeholder="Water Cleared (Liters)" class="w-full bg-gray-800 p-3 rounded mb-4 border border-gray-700">
            <button onclick="window.switchTab('workout')" class="w-full bg-blue-600 py-4 rounded-xl font-bold">Start Mission</button>
        </div>

        <div id="view-workout" class="hidden">
            <div id="activeWorkoutUI" class="space-y-4"></div>
            <button onclick="window.completeFlight()" id="completeFlightBtn" class="w-full bg-green-600 py-4 rounded-xl mt-4">Complete Flight</button>
        </div>

        <div id="view-export" class="hidden">
            <h2 class="text-xl font-bold mb-4">Health Trends</h2>
            <canvas id="healthChart" class="mb-6"></canvas>
            <div class="space-y-2">
                <input type="number" id="weightEntry" placeholder="Weight (lbs)" class="w-full bg-gray-800 p-2 rounded">
                <button onclick="window.saveBiometrics()" class="w-full bg-blue-700 p-2 rounded">Log Biometrics</button>
            </div>
        </div>

        <div id="view-wisdom" class="hidden">
            <h2 class="text-xl font-bold mb-4">Flight Deck Wisdom</h2>
            <div id="wisdomDisplay" class="bg-gray-800 p-6 rounded-xl min-h-[150px]"></div>
            <div class="flex justify-between mt-4">
                <button onclick="window.showWisdom(-1)" class="bg-gray-700 px-6 py-2 rounded">Prev</button>
                <button onclick="window.showWisdom(1)" class="bg-gray-700 px-6 py-2 rounded">Next</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-gray-900 border-t border-gray-800 flex justify-around py-3">
        <button onclick="window.switchTab('dashboard')">Preflight</button>
        <button onclick="window.switchTab('workout')">Flight</button>
        <button onclick="window.switchTab('export')">Trends</button>
        <button onclick="window.switchTab('wisdom')">Wisdom</button>
    </nav>

    <script src="/pilot-program/app.js"></script>
</body>
</html>
