*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0d1b2a;--navy2:#152639;--navy3:#1e3550;
  --gold:#c9a84c;--gold-bg:#fdf8ee;
  --red:#e05c4b;--red-bg:#fff0ee;
  --green:#2a9d5c;--green-bg:#edfaf3;
  --blue:#2f6eb5;--blue-bg:#eef4fd;
  --bg:#f5f3ef;--card:#ffffff;--border:#e2ddd6;
  --text:#0d1b2a;--muted:#6b6560;--hint:#a39e99;--light:#f9f7f4;
  --r:14px;--rs:8px;
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);
}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
input,button,select{font-family:'DM Sans',sans-serif}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
.nav{background:var(--navy);padding:calc(12px + var(--safe-top)) 20px 12px;flex-shrink:0}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.nav-title{color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.08em}
.nav-right{display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#3aab6d;flex-shrink:0}
.sync-dot.off{background:#555}
.user-badge{font-size:11px;color:#8899aa;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(16px + var(--safe-bottom))}
.tab-bar{background:var(--navy2);border-top:1px solid var(--navy3);display:flex;padding:6px 4px calc(6px + var(--safe-bottom));flex-shrink:0}
.tab{flex:1;border:none;background:transparent;color:#6677aa;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:var(--rs);transition:all 0.15s}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--gold)}.tab.active svg{stroke:var(--gold)}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px;margin-bottom:12px}
.shdr{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:0.06em;color:var(--muted);margin-bottom:8px;margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.gbtn{border:2px solid var(--border);background:var(--card);border-radius:12px;padding:14px 8px 12px;cursor:pointer;text-align:center;transition:all 0.2s;-webkit-user-select:none}
.gbtn:active{transform:scale(0.96)}.gbtn.sel{border-color:var(--gold);background:var(--gold-bg)}
.gbtn .gi{font-size:24px;margin-bottom:4px}.gbtn .gl{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:0.04em}
.gbtn .gs{font-size:10px;color:var(--muted);margin-top:2px}
.wkbadge{display:inline-flex;align-items:center;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.06em;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.wktitle{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.04em}
.wksub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.pw{background:var(--border);border-radius:4px;height:5px;margin-top:10px;overflow:hidden}
.pf{height:100%;border-radius:4px;background:var(--gold);transition:width 0.5s}
.pl{font-size:11px;color:var(--muted);margin-top:4px}
.exc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.exh{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;background:var(--light);-webkit-user-select:none}
.exn{font-weight:600;font-size:14px}.ext{font-size:11px;color:var(--muted);margin-top:2px}
.exr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.exck{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.exck.done{background:var(--green);border-color:var(--green);color:white}
.excv{color:var(--hint);font-size:16px;transition:transform 0.2s;line-height:1}
.excv.open{transform:rotate(180deg)}
.exb{padding:12px 14px;border-top:1px solid var(--border)}
.rw{font-size:12px;color:var(--blue);font-weight:500;margin-bottom:10px}
.ss{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ss::-webkit-scrollbar{display:none}
.st{flex-shrink:0;width:90px;background:var(--light);border-radius:10px;padding:10px 8px;border:1.5px solid var(--border)}
.st.ok{border-color:var(--green);background:var(--green-bg)}
.sl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;text-align:center}
.si{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 4px;font-size:14px;font-weight:500;text-align:center;background:white;color:var(--text);margin-bottom:4px;-webkit-appearance:none}
.si:focus{outline:none;border-color:var(--gold)}
.sh{font-size:9px;color:var(--hint);text-align:center}
.ssh{font-size:10px;color:var(--hint);text-align:center;margin-top:4px}
.note{background:var(--blue-bg);border-left:3px solid var(--blue);border-radius:0 var(--rs) var(--rs) 0;padding:10px 12px;font-size:12px;color:#1a4a8a;line-height:1.5;margin-bottom:12px}
.note.gld{background:var(--gold-bg);border-color:var(--gold);color:#7a5010}
.note.grn{background:var(--green-bg);border-color:var(--green);color:#145c35}
.note.red{background:var(--red-bg);border-color:var(--red);color:#8a1a1a}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:center;-webkit-user-select:none}
.btn:active{transform:scale(0.97)}
.btn-p{background:var(--navy);color:var(--gold)}.btn-g{background:var(--gold);color:var(--navy)}
.btn-grn{background:var(--green);color:white}.btn-o{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-red{background:var(--red-bg);border:1.5px solid #fcc;color:var(--red)}
.btn-sm{padding:7px 14px;font-size:12px;font-weight:600;width:auto;display:inline-block;border-radius:var(--rs)}
.btn-i{background:transparent;border:1.5px solid var(--border);color:var(--blue);font-size:12px;padding:6px 10px;border-radius:6px;width:auto;display:inline-block}

.mt{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.04em;margin-bottom:8px}
.mb{font-size:14px;line-height:1.7;color:#333}
.cbanner{background:linear-gradient(135deg,#1a7a4a,#2a9d5c);color:white;border-radius:var(--r);padding:20px;text-align:center;margin-bottom:16px}
.sstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sbox{background:var(--card);border-radius:var(--rs);border:1px solid var(--border);padding:12px 8px;text-align:center}
.sv{font-family:'Bebas Neue',sans-serif;font-size:26px}.slb{font-size:10px;color:var(--muted);margin-top:1px}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

.phero{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--r);padding:20px;margin-bottom:16px;text-align:center}

.gcrd .gs{font-size:9px;color:var(--muted);margin-top:2px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em}
.fld input,.fld select{width:100%;border:1.5px solid var(--border);border-radius:var(--rs);padding:11px 12px;font-size:15px;color:var(--text);background:white;-webkit-appearance:none}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--gold)}
.lvl{border:2px solid var(--border);background:var(--card);border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center;font-size:12px;font-weight:600;transition:all 0.2s;-webkit-user-select:none}
.lvl.sel{border-color:var(--gold);background:var(--gold-bg)}
/* CUSTOM EXERCISE */
.add-ex-wrap{border:2px dashed var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;background:var(--light)}
.add-ex-form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.add-ex-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}
.add-ex-inp{border:1.5px solid var(--border);border-radius:var(--rs);padding:9px 10px;font-size:13px;background:white;color:var(--text);width:100%}
.add-ex-inp:focus{outline:none;border-color:var(--gold)}
.custom-tag{font-size:9px;font-weight:700;background:var(--navy);color:var(--gold);padding:2px 5px;border-radius:4px;margin-left:4px;vertical-align:middle;letter-spacing:0.04em}
.delete-ex{background:transparent;border:none;color:var(--hint);font-size:16px;cursor:pointer;padding:4px;line-height:1}
.delete-ex:hover{color:var(--red)}
.scard{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:20px;margin-bottom:16px}
.scard h3{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.04em;margin-bottom:12px}
.sstep{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:13px;line-height:1.5}
.snum{width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.scode{background:#0d1b2a;color:#c9a84c;border-radius:8px;padding:12px;font-family:monospace;font-size:10px;line-height:1.6;overflow-x:auto;margin:8px 0;white-space:pre}
.emsg{color:var(--red);font-size:12px;margin-top:8px;display:none}.emsg.on{display:block}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}

.hidden{display:none!important}

// ─── SUPABASE ─────────────────────────────────────────────────────────────────
let sb=null,sbUser=null;
function initSB(){
  if(SB_URL==='YOUR_SUPABASE_URL') return false;
  try{sb=supabase.createClient(SB_URL,SB_ANON);return true;}catch{return false;}
}
async function checkAuth(){if(!sb)return null;const{data:{session}}=await sb.auth.getSession();return session?.user||null;}
async function doSignIn(email,pass){const{data,error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;return data.user;}
async function doSignUp(email,pass){const{data,error}=await sb.auth.signUp({email,password:pass});if(error)throw error;return data.user;}
async function doSignOut(){await sb.auth.signOut();sbUser=null;ST.sessions=[];ST.cur=null;ST.page='auth';render();}

// ─── LOCAL STORAGE FALLBACK ───────────────────────────────────────────────────
const LS={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  keys(p){try{return Object.keys(localStorage).filter(k=>k.startsWith(p));}catch{return[];}},
};
async function dbGetProfile(){if(!sb||!sbUser)return LS.get('pp_profile');const{data}=await sb.from('user_profiles').select('*').eq('user_id',sbUser.id).maybeSingle();return data?.profile_data||null;}
async function dbSetProfile(p){if(!sb||!sbUser){LS.set('pp_profile',p);return;}await sb.from('user_profiles').upsert({user_id:sbUser.id,profile_data:p,updated_at:new Date().toISOString()},{onConflict:'user_id'});}
async function dbGetCur(){if(!sb||!sbUser)return LS.get('pp_cur');const{data}=await sb.from('current_workout').select('*').eq('user_id',sbUser.id).maybeSingle();return data?.workout_data||null;}
async function dbSetCur(w){if(!sb||!sbUser){LS.set('pp_cur',w);return;}await sb.from('current_workout').upsert({user_id:sbUser.id,workout_data:w,updated_at:new Date().toISOString()},{onConflict:'user_id'});}
async function dbGetSessions(){if(!sb||!sbUser){return LS.keys('pp_s:').map(k=>LS.get(k)).filter(Boolean).sort((a,b)=>a.started-b.started);}const{data}=await sb.from('workout_sessions').select('*').eq('user_id',sbUser.id).order('started_at',{ascending:true});return(data||[]).map(r=>r.session_data);}
async function dbSaveSession(s){if(!sb||!sbUser){LS.set('pp_s:'+s.started,s);return;}await sb.from('workout_sessions').upsert({user_id:sbUser.id,session_key:String(s.started),session_data:s,started_at:new Date(s.started).toISOString(),workout_key:s.key||'?'},{onConflict:'user_id,session_key'});}
async function dbGetWeights(){if(!sb||!sbUser)return LS.get('pp_wts')||[];const{data}=await sb.from('weight_log').select('*').eq('user_id',sbUser.id).order('logged_at',{ascending:true});return(data||[]).map(r=>({date:r.logged_at,weight:r.weight_lb}));}
async function dbLogWeight(w){const en={date:new Date().toISOString(),weight:w};if(!sb||!sbUser){const a=LS.get('pp_wts')||[];a.push(en);LS.set('pp_wts',a);return;}await sb.from('weight_log').insert({user_id:sbUser.id,weight_lb:w,logged_at:new Date().toISOString()});}

  sessions:[],weights:[],profile:null,

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  const ok=initSB();
  if(ok) sbUser=await checkAuth();
  if(!ok){ST.page='setup';ST.loaded=true;render();return;}
  if(!sbUser){ST.page='auth';ST.loaded=true;render();return;}
  await loadData();
}
async function loadData(){
  [ST.profile,ST.sessions,ST.cur,ST.weights]=await Promise.all([dbGetProfile(),dbGetSessions(),dbGetCur(),dbGetWeights()]);
  if(!ST.profile){ST.page='profile';ST.profEdit=true;}
  else if(!ST.cur) await startNext();
  ST.loaded=true;render();
}
async function startNext(){
  const goal=ST.profile?.goal||'strength';
  const done=ST.sessions.filter(s=>s.complete&&s.goal===goal);
  let ri=0;if(done.length) ri=(done[done.length-1].rotIdx+1)%ROT.length;
  ST.cur={rotIdx:ri,key:ROT[ri],goal,started:Date.now(),sets:{},customExercises:[],complete:false};
  await dbSetCur(ST.cur);
}
async function completeWk(){
  ST.cur.complete=true;ST.cur.completedAt=Date.now();
  ST.cur.gymUsed=ST.gymType;ST.cur.hotelOpt=ST.hotelOpt;
  await dbSaveSession({...ST.cur});
  ST.sessions.push({...ST.cur});
  await startNext();
}
async function saveCur(){await dbSetCur(ST.cur);}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function getGD(){return WK[ST.profile?.goal||'strength'];}
function getGymKey(){return ST.gymType==='commercial'?'commercial':ST.hotelOpt;}
function getWD(){
  const gd=getGD();if(!gd||!ST.cur)return null;
  const day=gd[ST.cur.key];if(!day)return null;
  return day[getGymKey()]||day.commercial;
}
function lastWt(exId){
  for(let i=ST.sessions.length-1;i>=0;i--){
    const s=ST.sessions[i];if(!s.sets||!s.sets[exId])continue;
    const ws=s.sets[exId].map(x=>parseFloat(x.weight)||0).filter(w=>w>0);
    if(ws.length)return Math.max(...ws);
  }return null;
}
function allExs(){
  const all=[],seen=new Set();
  for(const goal of Object.values(WK))
    for(const day of Object.values(goal))
      if(day&&typeof day==='object')
        for(const gym of Object.values(day))
          if(gym?.exercises)
            for(const ex of gym.exercises)
              if(!seen.has(ex.id)){seen.add(ex.id);all.push(ex);}
  return all;
}
function trendPts(exId){
  return ST.sessions
    .filter(s=>s.sets&&s.sets[exId]&&s.sets[exId].some(x=>parseFloat(x.weight)>0))
    .map(s=>{
      const ws=s.sets[exId].map(x=>parseFloat(x.weight)||0).filter(w=>w>0);
      const vol=s.sets[exId].reduce((a,x)=>a+(parseFloat(x.weight)||0)*(parseFloat(x.reps)||0),0);
      return{date:new Date(s.started),maxW:Math.max(...ws),vol:Math.round(vol)};
    });
}
function doneCount(){
  const w=getWD();if(!w||!ST.cur)return 0;
  const customDone=(ST.cur.customExercises||[]).filter(ex=>{const s=ST.cur.sets['custom_'+ex.id];return s&&s.some(x=>x.reps||x.weight);}).length;
  return w.exercises.filter(ex=>{const s=ST.cur.sets[ex.id];return s&&s.some(x=>x.reps||x.weight);}).length + customDone;
}
function totalExCount(){
  const w=getWD();if(!w)return 0;
  return w.exercises.length+(ST.cur?.customExercises?.length||0);
}
function exportCSV(){
  const exMap=Object.fromEntries(allExs().map(e=>[e.id,e.name]));
  const rows=['Date,Goal,Workout,Gym,Exercise,Set,Reps,Weight(lb)'];
  for(const s of ST.sessions){
    if(!s.sets)continue;
    const gd=WK[s.goal||'strength'];
    const wDef=gd?.[s.key]?.[s.gymUsed==='commercial'?'commercial':s.hotelOpt||'hotel1'];
    const wName=wDef?.name||(s.key||'?');
    const date=new Date(s.started).toLocaleDateString('en-US');
    for(const[exId,sets]of Object.entries(s.sets)){
      const name=exMap[exId]||exId.replace('custom_','[Custom] ');
      sets.forEach((st,i)=>{
        if(!st.reps&&!st.weight)return;
        rows.push([date,s.goal||'',wName,s.gymUsed||'',name,i+1,st.reps||'',st.weight||''].join(','));
      });
    }
  }
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='pilot_program.csv';a.click();
  URL.revokeObjectURL(url);
}

    b.innerHTML=`<div class="gi">${g.icon}</div><div class="gl">${g.label}</div><div class="gs">${g.sub}</div>`;
    b.onclick=()=>{ST.gymType=g.id;render();};
    gg.appendChild(b);
  });
  page.appendChild(gg);

  if(ST.gymType==='hotel'){
    const hg=mk('div','g2');
    [{id:'hotel1',icon:'🏨',label:'Good Hotel Gym',sub:'DBs, machines, cardio'},
     {id:'hotel2',icon:'🏃',label:'Minimal / None',sub:'Bodyweight only'}].forEach(o=>{

    });

    page.appendChild(n);return;
  }

  const wDef=getWD();if(!wDef)return;

  if(ST.cur.complete){
    const cb=mk('div','cbanner');
    cb.innerHTML='<div style="font-size:32px;margin-bottom:6px">🎉</div><h2 style="font-family:\'Bebas Neue\',sans-serif;font-size:24px;letter-spacing:0.06em">Workout Complete!</h2><p style="font-size:13px;opacity:0.85;margin-top:4px">Next workout queued</p>';

    <div class="wkbadge" style="background:${gd.color}22;color:${gd.color};border:1px solid ${gd.color}44">${wDef.label}</div>
    ${goal?`<span style="font-size:12px;color:var(--muted)">${goal.icon} ${goal.label}</span>`:''}
  </div>
  <div class="wktitle">${wDef.name}</div>
  <div class="wksub">${wDef.note||''}</div>

  <div class="pl">${cc} of ${tot} exercises logged</div>`;

  wDef.exercises.forEach(ex=>page.appendChild(renderExercise(ex,wDef,gd,false)));

  // Add Custom Exercise

function renderAddExercise(){
  const wrap=mk('div','add-ex-wrap');
  const hdrDiv=mk('div','fb');
  hdrDiv.innerHTML=`<div style="font-size:13px;font-weight:600;color:var(--muted)">+ Add Custom Exercise</div>`;
  const toggleBtn=mk('button','btn-i btn-sm');
  toggleBtn.textContent=ST.showAddEx?'Cancel':'Add';
  toggleBtn.onclick=()=>{ST.showAddEx=!ST.showAddEx;render();};
  hdrDiv.appendChild(toggleBtn);
  wrap.appendChild(hdrDiv);

  if(ST.showAddEx){
    const form=mk('div','add-ex-form');
    // Name field
    const nameInp=document.createElement('input');
    nameInp.className='add-ex-inp';nameInp.placeholder='Exercise name (e.g. Hip Thrust)';
    nameInp.type='text';nameInp.id='cex_name';
    form.appendChild(nameInp);
    // Target / sets row
    const row=mk('div','add-ex-row');
    const tgtInp=document.createElement('input');
    tgtInp.className='add-ex-inp';tgtInp.placeholder='Target (e.g. 3×10)';tgtInp.type='text';tgtInp.id='cex_tgt';
    const setsInp=document.createElement('input');
    setsInp.className='add-ex-inp';setsInp.placeholder='# Sets';setsInp.type='number';setsInp.id='cex_sets';
    setsInp.setAttribute('inputmode','numeric');setsInp.min='1';setsInp.max='10';
    const noteInp=document.createElement('input');
    noteInp.className='add-ex-inp';noteInp.placeholder='Notes (optional)';noteInp.type='text';noteInp.id='cex_note';
    row.appendChild(tgtInp);row.appendChild(setsInp);
    form.appendChild(row);form.appendChild(noteInp);
    const addBtn=mk('button','btn btn-p mt8');
    addBtn.textContent='Add to Workout';
    addBtn.style.marginTop='8px';
    addBtn.onclick=()=>{
      const name=document.getElementById('cex_name')?.value?.trim();
      const tgt=document.getElementById('cex_tgt')?.value?.trim()||'—';
      const setsN=parseInt(document.getElementById('cex_sets')?.value)||3;
      const note=document.getElementById('cex_note')?.value?.trim()||'Custom exercise';
      if(!name){alert('Enter an exercise name.');return;}
      if(!ST.cur.customExercises) ST.cur.customExercises=[];
      const uid='c'+Date.now();
      ST.cur.customExercises.push({id:uid,name,target:tgt,sets:setsN,ref:note,custom:true});
      ST.cur.sets['custom_'+uid]=Array.from({length:setsN},()=>({reps:'',weight:''}));
      ST.showAddEx=false;
      saveCur();render();
    };
    form.appendChild(addBtn);
    wrap.appendChild(form);
  }
  return wrap;
}

function renderExercise(ex,wDef,gd,isCustom){
  const exKey=isCustom?'custom_'+ex.id:ex.id;
  const isOpen=!!ST.expanded[exKey];
  if(!ST.cur.sets[exKey])
    ST.cur.sets[exKey]=Array.from({length:ex.sets},()=>({reps:'',weight:''}));
  const sets=ST.cur.sets[exKey];
  while(sets.length<ex.sets) sets.push({reps:'',weight:''});
  const hasData=sets.some(s=>s.reps||s.weight);
  const card=mk('div','exc');
  const hdr=mk('div','exh');
  hdr.innerHTML=`<div style="flex:1">
    <div class="exn">${ex.name}${isCustom?'<span class="custom-tag">CUSTOM</span>':''}</div>
    <div class="ext">${ex.target}</div>
  </div>
  <div class="exr">
    ${!isCustom?`<button class="btn-i" data-info="${exKey}">ℹ Guide</button>`:''}
    ${isCustom?`<button class="delete-ex" data-del="${ex.id}" title="Remove exercise">✕</button>`:''}
    <div class="exck ${hasData?'done':''}">${hasData?'✓':''}</div>
    <div class="excv ${isOpen?'open':''}">⌄</div>
  </div>`;
  if(!isCustom){
    hdr.querySelector('[data-info]').onclick=ev=>{
      ev.stopPropagation();
      ST.modal={name:ex.name,ref:ex.ref};render();
    };
  } else {
    hdr.querySelector('[data-del]').onclick=ev=>{
      ev.stopPropagation();
      if(!confirm(`Remove "${ex.name}"?`))return;
      ST.cur.customExercises=ST.cur.customExercises.filter(x=>x.id!==ex.id);
      delete ST.cur.sets['custom_'+ex.id];
      saveCur();render();
    };
  }
  hdr.onclick=ev=>{
    if(ev.target.closest('[data-info],[data-del]'))return;
    ST.expanded[exKey]=!ST.expanded[exKey];render();
  };
  card.appendChild(hdr);
  if(isOpen){
    const body=mk('div','exb');
    const lw=lastWt(exKey);
    if(lw!==null){const r=mk('div','rw');r.innerHTML=`📊 Last max: <strong>${lw} lb</strong> — match or beat it`;body.appendChild(r);}
    const scroll=mk('div','ss');
    sets.forEach((s,i)=>{
      const tile=mk('div','st'+(s.reps||s.weight?' ok':''));
      tile.innerHTML=`<div class="sl">Set ${i+1}</div>`;
      const ri=document.createElement('input');
      ri.type='number';ri.className='si';ri.placeholder='Reps';ri.value=s.reps||'';ri.setAttribute('inputmode','numeric');
      ri.onchange=ri.onblur=()=>{sets[i].reps=ri.value;tile.className='st'+(ri.value||sets[i].weight?' ok':'');saveCur();};
      const wi=document.createElement('input');
      wi.type='number';wi.className='si';wi.placeholder='lb';wi.value=s.weight||'';wi.setAttribute('inputmode','decimal');
      wi.onchange=wi.onblur=()=>{sets[i].weight=wi.value;tile.className='st'+(sets[i].reps||wi.value?' ok':'');saveCur();};
      const hint=mk('div','sh');hint.textContent='reps / lb';
      tile.appendChild(ri);tile.appendChild(wi);tile.appendChild(hint);
      scroll.appendChild(tile);
    });
    body.appendChild(scroll);
    const hint2=mk('div','ssh');hint2.textContent='← swipe for all sets';
    body.appendChild(hint2);card.appendChild(body);
  }
  return card;
}

// ─── TRENDS PAGE ──────────────────────────────────────────────────────────────
function renderTrends(page){
  const total=ST.sessions.length;
  const comm=ST.sessions.filter(s=>s.gymUsed==='commercial').length;
  const hotel=total-comm;
  const strip=mk('div','sstrip');
  strip.innerHTML=`<div class="sbox"><div class="sv">${total}</div><div class="slb">Sessions</div></div>
    <div class="sbox"><div class="sv">${comm}</div><div class="slb">Home</div></div>
    <div class="sbox"><div class="sv">${hotel}</div><div class="slb">Hotel</div></div>`;
  page.appendChild(strip);

  const tg=mk('div','g2 mb8');
  [{id:'exercise',label:'💪 Exercise Trends'},{id:'weight',label:'⚖️ Body Weight'}].forEach(m=>{
    const b=mk('div','gbtn'+(ST.trendMode===m.id?' sel':''));
    b.innerHTML=`<div class="gl" style="font-size:13px">${m.label}</div>`;
    b.onclick=()=>{ST.trendMode=m.id;render();};
    tg.appendChild(b);
  });
  page.appendChild(tg);

  if(ST.trendMode==='weight'){renderWeightTrend(page);return;}

  if(!total){
    const e=mk('div','empty');
    e.innerHTML='<div style="font-size:44px;margin-bottom:12px">📈</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">No data yet</div><div style="font-size:13px">Complete workouts to see trends</div>';
    page.appendChild(e);return;
  }

  page.appendChild(lbl('Select Exercise'));
  const pills=mk('div','pills');
  let any=false;
  for(const ex of allExs()){
    const td=trendPts(ex.id);if(!td.length)continue;any=true;
    const p=mk('div','pill'+(ST.trendEx===ex.id?' active':''));
    p.textContent=ex.name;p.onclick=()=>{ST.trendEx=ex.id;render();};
    pills.appendChild(p);
  }
  if(any) page.appendChild(pills);

  if(ST.trendEx){
    const td=trendPts(ST.trendEx);
    if(td.length){
      const ex=allExs().find(e=>e.id===ST.trendEx);
      const latest=td[td.length-1],first=td[0];
      const gain=Math.round(latest.maxW-first.maxW);
      const gd=getGD();
      const cc=mk('div','card');
      cc.innerHTML=`<div class="fb mb8">
        <div style="font-weight:600;font-size:15px">${ex?.name||ST.trendEx}</div>
        ${gain!==0?`<div style="font-size:13px;font-weight:600;color:${gain>0?'var(--green)':'var(--red)'}">${gain>0?'+':''}${gain} lb</div>`:''}
      </div>
      <div class="cw"><canvas id="tc"></canvas></div>
      <div class="sstrip" style="margin-top:12px;margin-bottom:0">
        <div class="sbox"><div class="sv">${latest.maxW}</div><div class="slb">Max lb</div></div>
        <div class="sbox"><div class="sv">${td.length}</div><div class="slb">Sessions</div></div>
        <div class="sbox"><div class="sv">${latest.vol}</div><div class="slb">Last Volume</div></div>
      </div>`;
      page.appendChild(cc);
    }
  }
}

function renderWeightTrend(page){
  const logCard=mk('div','card mb8');
  logCard.innerHTML=`<div style="font-weight:600;font-size:14px;margin-bottom:10px">Log Today's Weight</div>
    <div style="display:flex;gap:8px">
      <input type="number" id="wt_inp" inputmode="decimal" placeholder="lbs"
        style="flex:1;border:1.5px solid var(--border);border-radius:var(--rs);padding:10px 12px;font-size:16px;background:white;color:var(--text);"
        value="${ST.newWt||''}">
      <button class="btn btn-g" style="width:auto;padding:10px 18px" onclick="logWeight()">Log</button>
    </div>`;
  logCard.querySelector('#wt_inp').oninput=e=>ST.newWt=e.target.value;
  page.appendChild(logCard);

  if(!ST.weights.length){
    const e=mk('div','empty');
    e.innerHTML='<div style="font-size:44px;margin-bottom:12px">⚖️</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">No weight logged yet</div><div style="font-size:13px">Log your first entry above</div>';
    page.appendChild(e);return;
  }

  const latest=ST.weights[ST.weights.length-1],first=ST.weights[0];
  const delta=Math.round((latest.weight-first.weight)*10)/10;
  const wc=mk('div','card');
  wc.innerHTML=`<div class="fb mb8">
    <div style="font-weight:600;font-size:15px">Body Weight</div>
    ${delta!==0?`<div style="font-size:13px;font-weight:600;color:${delta<0?'var(--green)':'var(--red)'}">${delta>0?'+':''}${delta} lb</div>`:''}

    <div class="sbox"><div class="sv">${ST.weights.length}</div><div class="slb">Entries</div></div>
  </div>`;
  page.appendChild(wc);
}

async function logWeight(){
  const inp=document.getElementById('wt_inp');
  const val=parseFloat(inp?.value||ST.newWt);
  if(!val||val<50||val>500)return;
  await dbLogWeight(val);
  ST.weights=await dbGetWeights();
  ST.newWt='';render();
}

function drawChart(id,labels,data,yLabel){
  const canvas=document.getElementById(id);if(!canvas)return;
  if(chartInst){chartInst.destroy();chartInst=null;}
  chartInst=new Chart(canvas.getContext('2d'),{
    type:'line',
    data:{labels,datasets:[{label:yLabel,data,borderColor:'#c9a84c',backgroundColor:'rgba(201,168,76,0.12)',tension:0.35,fill:true,pointBackgroundColor:'#c9a84c',pointRadius:5,pointHoverRadius:7}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#888',maxRotation:45}},
              y:{grid:{color:'#f0ede8'},ticks:{font:{size:10},color:'#888'}}}},
  });
}

  if(!p){
    const wc=mk('div','card mb8');
    wc.innerHTML=`<div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--navy);letter-spacing:0.04em;margin-bottom:4px">Welcome, Pilot</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.5">Set up your profile to get a personalized workout plan.</div>`;
    page.appendChild(wc);
  }

  const ic=mk('div','card');
  ic.innerHTML=`<div class="shdr" style="margin-top:0">About You</div>
    <div class="fld"><label>Name (optional)</label><input type="text" id="p_name" value="${draft.name||''}" placeholder="Callsign or name"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fld"><label>Age</label><input type="number" id="p_age" inputmode="numeric" value="${draft.age||''}" placeholder="49"></div>
      <div class="fld"><label>Weight (lb)</label><input type="number" id="p_wt" inputmode="decimal" value="${draft.weight||''}" placeholder="185"></div>
    </div>`;
  page.appendChild(ic);
  ic.querySelector('#p_name').oninput=e=>draft.name=e.target.value;
  ic.querySelector('#p_age').oninput=e=>draft.age=e.target.value;
  ic.querySelector('#p_wt').oninput=e=>draft.weight=e.target.value;

  const lvc=mk('div','card');
  lvc.innerHTML='<div class="shdr" style="margin-top:0">Fitness Level</div>';
  const lvg=mk('div','g3');
  [{id:'beginner',l:'Beginner'},{id:'intermediate',l:'Intermediate'},{id:'advanced',l:'Advanced'}].forEach(lv=>{
    const b=mk('div','lvl'+(draft.level===lv.id?' sel':''));
    b.textContent=lv.l;
    b.onclick=()=>{draft.level=lv.id;document.querySelectorAll('.lvl').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
    lvg.appendChild(b);
  });
  lvc.appendChild(lvg);page.appendChild(lvc);

  const gc2=mk('div','card');
  gc2.innerHTML='<div class="shdr" style="margin-top:0">Training Goal</div>';
  const gg2=mk('div','');
  gg2.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px';
  GOALS.forEach(g=>{
    const b=mk('div','gcrd'+(draft.goal===g.id?' sel':''));
    b.innerHTML=`<div class="gi">${g.icon}</div><div class="gl">${g.label}</div><div class="gs">${g.sub}</div>`;
    b.onclick=()=>{draft.goal=g.id;document.querySelectorAll('.gcrd').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
    gg2.appendChild(b);
  });
  gc2.appendChild(gg2);page.appendChild(gc2);

  const sv=mk('button','btn btn-g mt8');
  sv.textContent=p?'Save Changes':'Build My Program →';
  sv.onclick=async()=>{
    if(!draft.goal){alert('Please select a goal.');return;}
    ST.profile={...draft};
    await dbSetProfile(ST.profile);
    if(draft.weight&&parseFloat(draft.weight)>0)
      if(!p||draft.weight!==p.weight) await dbLogWeight(parseFloat(draft.weight));
    ST.profEdit=false;ST.profDraft=null;
    if(p?.goal!==draft.goal){ST.cur=null;await startNext();}
    render();
  };
  page.appendChild(sv);
  if(p){
    const cn=mk('button','btn btn-o mt8');cn.textContent='Cancel';
    cn.onclick=()=>{ST.profEdit=false;ST.profDraft=null;render();};page.appendChild(cn);
  }
}

// ─── SETUP & AUTH ─────────────────────────────────────────────────────────────
function renderSetup(app){
  app.innerHTML=`<div class="page" style="overflow-y:auto;height:100dvh;padding-bottom:40px">
    <div style="text-align:center;padding:32px 0 24px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--navy);letter-spacing:0.08em">✈ PILOT PROGRAM</div>
      <div style="font-size:14px;color:var(--muted);margin-top:4px">One-time setup — ~10 minutes</div>
    </div>
    <div class="scard"><h3>Step 1 — Supabase Database</h3>
      <div class="sstep"><div class="snum">1</div><div>Go to <a style="color:var(--blue)" href="https://supabase.com" target="_blank">supabase.com</a> → free account → new project</div></div>
      <div class="sstep"><div class="snum">2</div><div>Project Settings → API → copy Project URL and anon key</div></div>
      <div class="sstep"><div class="snum">3</div><div>SQL Editor → run the SQL from README.md (includes new tables for this version)</div></div>
    </div>
    <div class="scard"><h3>Step 2 — Edit index.html</h3>
      <div class="sstep"><div class="snum">1</div><div>Find the two <code style="background:#f0ede8;padding:2px 5px;border-radius:4px">YOUR_SUPABASE_...</code> lines near the top</div></div>
      <div class="sstep"><div class="snum">2</div><div>Replace with your actual values. Save.</div></div>
    </div>
    <div class="scard"><h3>Step 3 — GitHub Pages</h3>
      <div class="sstep"><div class="snum">1</div><div>Upload index.html and manifest.json to your pilot-program repo</div></div>
      <div class="sstep"><div class="snum">2</div><div>Settings → Pages → deploy from main → wait 2 min</div></div>
    </div>
    <div class="note gld">See README.md for the complete SQL setup script.</div>
  </div>`;
}

function renderAuth(app){
  const isUp=ST.authMode==='signup';
  app.innerHTML=`<div class="page" style="display:flex;flex-direction:column;justify-content:center;min-height:100dvh">
    <div style="text-align:center;padding:0 0 32px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--navy);letter-spacing:0.08em">✈ PILOT PROGRAM</div>
      <div style="font-size:14px;color:var(--muted);margin-top:4px">Your training starts here</div>
    </div>
    <div class="scard">
      <h3>${isUp?'Create Account':'Sign In'}</h3>
      <div class="fld"><label>Email</label><input type="email" id="ae" value="${ST.authEmail}" placeholder="your@email.com" autocomplete="email"></div>
      <div class="fld"><label>Password</label><input type="password" id="ap" value="${ST.authPass}" placeholder="${isUp?'Choose a password':'Password'}" autocomplete="${isUp?'new-password':'current-password'}"></div>
      <div class="emsg${ST.authErr?' on':''}">${ST.authErr}</div>
      <button class="btn btn-p mt12" id="asub">${isUp?'Create Account':'Sign In'}</button>
    </div>
    <div style="text-align:center;font-size:13px;color:var(--muted)">
      ${isUp?'Already have an account?':'New here?'}
      <button onclick="ST.authMode='${isUp?'signin':'signup'}';ST.authErr='';render();" style="background:none;border:none;color:var(--blue);font-size:13px;cursor:pointer;text-decoration:underline;font-family:'DM Sans',sans-serif">${isUp?'Sign in':'Sign up'}</button>
    </div>
  </div>`;
  document.getElementById('ae').oninput=ev=>ST.authEmail=ev.target.value;
  document.getElementById('ap').oninput=ev=>ST.authPass=ev.target.value;
  document.getElementById('asub').onclick=async()=>{
    const email=document.getElementById('ae').value.trim();
    const pass=document.getElementById('ap').value;
    const btn=document.getElementById('asub');
    btn.textContent='...';btn.disabled=true;
    try{
      sbUser=isUp?await doSignUp(email,pass):await doSignIn(email,pass);
      if(sbUser){ST.page='workout';await loadData();}
      else{ST.authErr='Check your email to confirm, then sign in.';render();}
    }catch(ev){ST.authErr=ev.message||'Authentication failed';render();}
  };
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function mk(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function lbl(txt){const e=mk('div','shdr');e.textContent=txt;return e;}

init();
</script>
</body>
</html>
