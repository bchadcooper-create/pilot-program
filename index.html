<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flight Crew Fitness">
    <meta name="theme-color" content="#0d1b2a">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Flight Crew Fitness</title>
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="/pilot-program/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <style>
        .hidden { display: none !important; }
        .tab-active { color: #3b82f6; border-top: 2px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans select-none">

    <main id="app" class="flex-grow overflow-y-auto pb-20 p-4 max-w-md mx-auto w-full">
        <div id="view-dashboard" class="space-y-6">
            <div class="bg-gray-800 rounded-xl p-5 border border-gray-700">
                <h2 class="text-xs uppercase tracking-widest text-gray-400 mb-1">Systems Status</h2>
                <div class="flex items-end justify-between">
                    <p class="text-3xl font-bold text-green-400">Operational</p>
                    <p class="text-sm text-gray-500">Systems Online.</p>
                </div>
            </div>
            <button onclick="window.switchTab('workout')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition">
                Initiate Takeoff Briefing
            </button>
        </div>

        <div id="view-workout" class="hidden space-y-6">
            <div id="takeoffBriefing" class="bg-gray-800 rounded-xl p-5 border border-gray-700 space-y-4">
                <h2 class="text-lg font-bold border-b border-gray-700 pb-2 text-blue-400">Takeoff Briefing</h2>
                <input type="number" id="blockHours" placeholder="Block Time (Hours)" class="w-full bg-gray-900 p-2 rounded">
                <input type="number" id="waterCleared" placeholder="Water Cleared (Liters)" class="w-full bg-gray-900 p-2 rounded">
                <div id="hydrationResult" class="hidden text-sm p-2 rounded"></div>
                <label class="flex items-center justify-between">
                    <span>Fatigue Mode</span>
                    <input type="checkbox" id="fatigueToggle">
                </label>
            </div>
            <div id="activeWorkoutUI" class="space-y-6"></div>
            <button onclick="window.completeFlight()" id="completeFlightBtn" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg hidden">
                Complete Flight
            </button>
        </div>

        <div id="view-export" class="hidden">
            <div class="bg-gray-800 rounded-xl p-5 border border-gray-700">
                <h2 class="text-lg font-bold text-blue-400">Route Review</h2>
            </div>
        </div>
    </main>

    <nav class="bg-gray-900 border-t border-gray-800 fixed bottom-0 w-full z-40">
        <div class="max-w-md mx-auto flex justify-around text-xs font-semibold text-gray-500">
            <button onclick="window.switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-4 tab-active">Dashboard</button>
            <button onclick="window.switchTab('workout')" id="tab-workout" class="flex-1 py-4">Workout</button>
            <button onclick="window.switchTab('export')" id="tab-export" class="flex-1 py-4">Route Review</button>
        </div>
    </nav>

    <script src="/pilot-program/app.js"></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof window.init === 'function') {
                window.init();
            }
        });
    </script>
</body>
</html>
