<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Flight Crew Fitness | Master SOP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .tab-active { color: #3b82f6; border-top: 2px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">
    <main id="app" class="p-4 max-w-md mx-auto mb-24">
        <div id="view-dashboard">
            <h1 class="text-2xl font-bold mb-6 text-blue-400">Preflight Briefing</h1>
            <label class="block text-xs uppercase text-gray-500 mb-1">Mission Environment</label>
            <select id="gymEnv" class="w-full bg-gray-800 p-3 rounded mb-4 border border-gray-700">
                <option value="room">Hotel Room (Minimal)</option>
                <option value="hotel">Hotel Gym (Variable)</option>
                <option value="comm">Commercial Gym (Full)</option>
            </select>
            <input type="number" id="blockHours" placeholder="Flight Hours" class="w-full bg-gray-800 p-3 rounded mb-2 border border-gray-700">
            <input type="number" id="waterCleared" placeholder="Water Cleared (Liters)" class="w-full bg-gray-800 p-3 rounded mb-4 border border-gray-700">
            <button onclick="window.startMission()" class="w-full bg-blue-600 py-4 rounded-xl font-bold hover:bg-blue-500">ENGAGE WORKOUT</button>
        </div>

        <div id="view-workout" class="hidden">
            <h1 class="text-2xl font-bold mb-6 text-blue-400">Flight Plan</h1>
            <div id="activeWorkoutUI" class="space-y-6"></div>
            <button onclick="window.completeFlight()" class="w-full bg-green-600 py-4 rounded-xl mt-8 font-bold">SECURE FLIGHT</button>
        </div>

        <div id="view-export" class="hidden">
            <h1 class="text-2xl font-bold mb-6 text-blue-400">Health Trends</h1>
            <canvas id="healthChart" class="mb-8 bg-gray-800 p-4 rounded-xl"></canvas>
            <div class="bg-gray-800 p-5 rounded-xl space-y-3">
                <input type="number" id="weightLog" placeholder="Weight (lbs)" class="w-full bg-gray-900 p-3 rounded border border-gray-700">
                <input type="number" id="bpLog" placeholder="Systolic BP" class="w-full bg-gray-900 p-3 rounded border border-gray-700">
                <input type="number" id="glucoseLog" placeholder="Fasting Glucose" class="w-full bg-gray-900 p-3 rounded border border-gray-700">
                <button onclick="window.saveBiometrics()" class="w-full bg-blue-700 py-3 rounded font-bold">LOG DATA</button>
            </div>
        </div>

        <div id="view-wisdom" class="hidden">
            <h1 class="text-2xl font-bold mb-6 text-blue-400">Flight Deck Wisdom</h1>
            <div id="wisdomDisplay" class="bg-gray-800 p-6 rounded-xl min-h-[200px] border border-gray-700 text-center"></div>
            <div class="flex justify-between mt-6">
                <button onclick="window.showWisdom(-1)" class="bg-gray-700 px-8 py-3 rounded-lg font-bold">PREV</button>
                <button onclick="window.showWisdom(1)" class="bg-gray-700 px-8 py-3 rounded-lg font-bold">NEXT</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-gray-900 border-t border-gray-800 flex justify-around py-4 z-50">
        <button onclick="window.switchTab('dashboard')" class="text-xs">Preflight</button>
        <button onclick="window.switchTab('workout')" class="text-xs">Flight</button>
        <button onclick="window.switchTab('export')" class="text-xs">Trends</button>
        <button onclick="window.switchTab('wisdom')" class="text-xs">Wisdom</button>
    </nav>
    <script src="/pilot-program/app.js"></script>
</body>
</html>
