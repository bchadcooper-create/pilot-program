<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited: Flight Crew Fitness</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="A crew member invited you to Flight Crew Fitness">
<meta property="og:description" content="Follow their workouts and train around the trips you actually fly. Free to start.">
<meta property="og:url" content="https://flightcrew.fit/">
<meta property="og:image" content="https://flightcrew.fit/og-image.png">
<meta property="og:site_name" content="Flight Crew Fitness">
<meta name="twitter:card" content="summary_large_image">
<!-- Crew invite link (Crew > Find > Invite crew). Link form: /go/crew/?u=<member id>&n=<call sign>.
     Computers and Android go straight to the web app, which opens that member's profile (?follow=).
     iPhones and iPads see this page: the iPhone app has no universal links yet, so the page gives
     the call sign to search and the App Store button. Chad, Nov 27 2026. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var u = (q.get('u') || '').toLowerCase();
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(u)) u = '';
  var ua = navigator.userAgent || '';
  var apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  window.__inviteWeb = '/?ref=invite' + (u ? '&follow=' + u : '');
  if (!apple) location.replace(window.__inviteWeb);
})();
</script>
<style>
  :root { --gold:#856819; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:420px; margin:0 auto; padding:40px 20px; }
  .logo { font-family:ui-monospace,Menlo,monospace; letter-spacing:.18em; color:var(--gold); font-size:.9rem; text-align:center; margin-bottom:24px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px; }
  h1 { font-size:1.35rem; margin:0 0 8px; line-height:1.3; }
  p { color:var(--muted); line-height:1.55; margin:0 0 16px; font-size:.95rem; }
  .cs { color:var(--gold); }
  .btn { display:block; text-align:center; text-decoration:none; padding:14px; border-radius:12px; font-weight:600; margin-top:10px; }
  .gold { background:var(--gold); color:#fff; }
  .outline { border:1px solid var(--border); color:var(--text); background:#fff; }
  .steps { font-size:.9rem; line-height:1.6; margin:18px 0 0; padding:14px 16px; background:#f1f5f9; border-radius:12px; }
  .steps b { color:var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">✈ FLIGHT CREW FITNESS</div>
  <div class="card">
    <h1 id="title">A crew member invited you</h1>
    <p>Follow their workouts and train around the trips you actually fly. Free to start.</p>
    <a class="btn gold" href="https://apps.apple.com/app/apple-store/id6807968764?pt=129388803&amp;ct=Invite&amp;mt=8">Get the app</a>
    <div class="steps" id="steps"><b>After installing, come back and tap this link again.</b> It opens the app right on their profile.</div>
    <a class="btn outline" id="web" href="/?ref=invite">Use it in the browser instead</a>
  </div>
</div>
<script>
(function () {
  var n = (new URLSearchParams(location.search).get('n') || '').replace(/[\u0000-\u001f]/g, '').slice(0, 30).trim();
  if (n) {
    var t = document.getElementById('title'); t.textContent = '';
    var s = document.createElement('span'); s.className = 'cs'; s.textContent = n;
    t.appendChild(s); t.appendChild(document.createTextNode(' invited you to Flight Crew Fitness'));
    var st = document.getElementById('steps'); st.textContent = '';
    var b0 = document.createElement('b'); b0.textContent = 'After installing, come back and tap this link again.'; st.appendChild(b0);
    st.appendChild(document.createTextNode(' It opens the app right on ' + n + '\u2019s profile.'));
    var more = document.createElement('div'); more.style.marginTop = '8px'; more.style.fontSize = '.85rem'; more.style.color = '#64748b';
    more.appendChild(document.createTextNode('Or open the app, tap Crew, then Find, and search '));
    var b3 = document.createElement('b'); b3.textContent = n; more.appendChild(b3);
    more.appendChild(document.createTextNode('.'));
    st.appendChild(more);
  }
  if (window.__inviteWeb) document.getElementById('web').setAttribute('href', window.__inviteWeb);
})();
</script>
</body>
</html>
