<div id="view-export" class="hidden p-4">
    <h1 class="text-xl font-bold mb-4">Biometric Logging</h1>
    <div class="space-y-4">
        <input type="number" id="weightLog" placeholder="Weight (lbs)" class="w-full bg-gray-800 p-3 rounded">
        <input type="number" id="bpLog" placeholder="Systolic BP" class="w-full bg-gray-800 p-3 rounded">
        <input type="number" id="glucoseLog" placeholder="Fasting Glucose" class="w-full bg-gray-800 p-3 rounded">
        <button onclick="window.saveBiometrics()" class="w-full bg-blue-700 py-3 rounded font-bold">Log Data</button>
    </div>
</div>
