<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1f22">
<title>DFW Crashpads</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen phone app. Sticky header, scrolling body, fixed bottom tab bar. Checklist feel: mono for bed IDs and money. */
:root{
  --bg:#f5f4f0; --panel:#ffffff; --fg:#1c1f22; --muted:#6b6f73; --line:#dedbd3;
  --accent:#c2410c; --accent-fg:#ffffff;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --warn:#a16207; --warn-bg:#fbf1d6; --bad:#b42318;--bad-fg:#ffffff; --bad-bg:#fbe4e1; --info:#245c9c; --info-bg:#e3edf9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--panel:#1f2226;--fg:#eceae4;--muted:#9aa0a6;--line:#33373d;--accent:#f97316;--accent-fg:#15171a;--ok:#4ade80;--ok-bg:#12321f;--warn:#fbbf24;--warn-bg:#3a2e0a;--bad:#f87171;--bad-fg:#15171a;--bad-bg:#3f1a17;--info:#7cb2f0;--info-bg:#15283d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--panel:#1f2226;--fg:#eceae4;--muted:#9aa0a6;--line:#33373d;--accent:#f97316;--accent-fg:#15171a;--ok:#4ade80;--ok-bg:#12321f;--warn:#fbbf24;--warn-bg:#3a2e0a;--bad:#f87171;--bad-fg:#15171a;--bad-bg:#3f1a17;--info:#7cb2f0;--info-bg:#15283d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h2{font-size:17px}
h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
[hidden]{display:none!important}

#app{height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;flex:1}
header .sub{font-size:12px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:6px 0 2px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.alert{color:var(--bad)}
nav button.on{color:var(--accent)}
nav button .badge{position:absolute;top:1px;left:50%;margin-left:2px;background:var(--bad);color:var(--bad-fg);font-size:10px;font-weight:700;line-height:16px;min-width:16px;padding:0 4px;border-radius:8px;text-align:center;box-shadow:0 0 0 2px var(--panel)}
nav button{position:relative}

.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card.tap{cursor:pointer}
.card.tap:active{opacity:.7}
.list{display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile .n{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1.1}
.tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.muted{background:var(--line);color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:active{opacity:.7}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:15px}
label.f>textarea{min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end}
.sheet>div{background:var(--panel);width:100%;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0}
.chk input{width:20px;height:20px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
#login{max-width:380px;margin:12vh auto 0;padding:0 16px}
#login .card{padding:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border-radius:999px}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.btn:active{transition:opacity .1s}}
</style>
</head>
<body>
<div id="app">
  <div id="login" hidden>
    <div class="card stack">
      <div><h1>DFW Crashpads</h1><div class="sub">Manager sign-in</div></div>
      <label class="f">Email<input id="li-email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="f">Password<input id="li-pass" type="password" autocomplete="current-password"></label>
      <button class="btn pri" id="li-go">Sign in</button>
      <div id="li-msg" class="small muted"></div>
    </div>
  </div>

  <div id="shell" hidden>
    <header>
      <div class="grow"><h1 id="hdr-title">Today</h1><div class="sub" id="hdr-sub"></div></div>
      <button class="btn sm" id="refresh" title="Refresh">&#8635;</button>
    </header>
    <main id="main"></main>
    <nav id="nav"></nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
// ---------- config ----------
const SUPABASE_URL = location.origin.includes('supabase.co') ? location.origin : 'https://uvkkfkaqlhvmyacxwoey.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FrD7kCH_qn6GBdojzBAEQg_Gx55fJ2B';
// Safari blocks localStorage for files opened from the Files app; fall back to memory so sign-in still works.
const memStore = {}; let storage;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); storage = localStorage; }
catch(e){ storage = { getItem:k=>memStore[k]??null, setItem:(k,v)=>{memStore[k]=v;}, removeItem:k=>{delete memStore[k];} }; }
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage, persistSession: true, autoRefreshToken: true } });

// ---------- state ----------
// From the 20th on, the month that matters is the coming one (rent due the 1st).
const S = { tab:'today', data:null, month:new Date().getDate()>=20 ? addMonths(firstOfMonth(new Date()),1) : firstOfMonth(new Date()), leadsFilter:'open', tenantsFilter:'current' };
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n)=>{ const v=Number(n||0); return (v<0?'-$':'$')+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:0}); };
function daysSince(s){ if(!s) return 9999; return Math.floor((Date.now()-new Date(String(s).slice(0,10)+'T12:00:00'))/86400000); }
function firstOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function iso(d){ if(!d) return null; const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function today(){ return iso(new Date()); }
function fmtD(s){ if(!s) return ''; const [y,m,d]=String(s).slice(0,10).split('-'); return `${Number(m)}/${Number(d)}/${String(y).slice(2)}`; }
function monthLabel(d){ return d.toLocaleString('en-US',{month:'short',year:'numeric'}); }
function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
// Texts go out from the Google Voice business number, not the phone's own Messages app.
function gvUrl(p){ return 'https://voice.google.com/u/0/messages?itemId=t.'+encodeURIComponent('+'+phoneDigits(p)); }
function phoneDigits(p){ const d=String(p||'').replace(/\D/g,''); return d.length===10?'1'+d:d; }
function fmtPhone(p){ let d=String(p||'').replace(/\D/g,''); if(d.length===11&&d[0]==='1') d=d.slice(1); return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:(p||''); }
let toastT; function toast(m){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }
function sheet(html){ closeSheet(); const s=document.createElement('div'); s.className='sheet'; s.id='sheet'; s.innerHTML='<div>'+html+'</div>'; s.addEventListener('click',e=>{ if(e.target===s) closeSheet(); }); document.body.appendChild(s); return s; }
function closeSheet(){ const s=$('sheet'); if(s) s.remove(); }
async function run(p, okMsg){ try{ const {error}=await p; if(error) throw error; if(okMsg) toast(okMsg); await load(); }catch(e){ toast('Error: '+(e.message||e)); console.error(e);} }

// ---------- auth ----------
$('li-go').onclick = async ()=>{
  $('li-msg').textContent='Signing in…';
  const {error} = await sb.auth.signInWithPassword({email:$('li-email').value.trim(), password:$('li-pass').value});
  $('li-msg').textContent = error ? error.message : '';
};
$('li-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('li-go').click(); });
sb.auth.onAuthStateChange((_e, session)=>{ if(session){ $('login').hidden=true; $('shell').hidden=false; load(); } else { $('shell').hidden=true; $('login').hidden=false; } });
$('refresh').onclick = ()=>load();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ checkUpdate(); if(S.data && Date.now()-S.data.at>60000) load(); } });

// ---------- self-update ----------
// GitHub Pages lets phones keep the page for 10 minutes. On open and on return to the app,
// ask for the latest copy directly; if the version differs, reload onto it.
const APP_VERSION = '2026.10.12-11';
async function checkUpdate(){
  try{
    const r = await fetch(location.pathname+'?check='+Date.now(), { cache:'no-store' });
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if(m && m[1]!==APP_VERSION){ toast('Updating the app…'); setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1])), 600); }
  }catch(e){}
}
checkUpdate();

// ---------- data ----------
async function load(){
  const m = iso(S.month);
  const [beds, tenants, payments, leads, cleaning, contacts, rent, settings, locks, doorkeys, nightly, doorlog, inbox] = await Promise.all([
    sb.from('cp_bed_status').select('*'),
    sb.from('cp_tenants').select('*').order('name'),
    sb.from('cp_payments').select('*').order('received_on',{ascending:false}).order('created_at',{ascending:false}).limit(400),
    sb.from('cp_leads').select('*').order('received_at',{ascending:false}),
    sb.from('cp_cleaning').select('*').order('needed_on'),
    sb.from('cp_contact_log').select('*').order('logged_at',{ascending:false}).limit(200),
    sb.rpc('cp_rent_for_month',{p_month:m}),
    sb.from('cp_settings').select('*'),
    sb.from('cp_locks').select('*').order('name'),
    sb.from('cp_door_keys').select('*').order('sent_at',{ascending:false}),
    sb.rpc('cp_nightly_by_month'),
    sb.from('cp_lock_events').select('username,lock_at,success').eq('success',true).order('lock_at',{ascending:false}).limit(400),
    sb.from('cp_payment_inbox').select('*').eq('status','review').order('received_on',{ascending:false}),
  ]);
  const err = [beds,tenants,payments,leads,cleaning,contacts,rent,settings,locks,doorkeys].find(r=>r.error);
  if(err){ toast('Load failed: '+err.error.message); if(/JWT|auth/i.test(err.error.message)) sb.auth.signOut(); return; }
  S.data = { at:Date.now(), beds:beds.data, tenants:tenants.data, payments:payments.data, leads:leads.data, cleaning:cleaning.data, contacts:contacts.data, rent:rent.data, settings:Object.fromEntries(settings.data.map(s=>[s.key,s.value])), locks:locks.data||[], doorkeys:doorkeys.data||[], nightly:(nightly&&!nightly.error&&nightly.data)||[], doorlog:(doorlog&&!doorlog.error&&doorlog.data)||[], inbox:(inbox&&!inbox.error&&inbox.data)||[] };
  render();
}
const T = ()=>S.data.tenants.find(t=>t.id===S.detail);
const tenantById = (id)=>S.data.tenants.find(t=>t.id===id);

// ---------- nav ----------
const TABS = [
  ['today','Today','<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>'],
  ['beds','Beds','<svg viewBox="0 0 24 24"><path d="M3 18V8M21 18v-6M3 12h18M3 12V9a2 2 0 0 1 2-2h6v5"/></svg>'],
  ['leads','Leads','<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0M19 3l2 2-2 2"/></svg>'],
  ['tenants','Tenants','<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20a7 7 0 0 1 14 0M15 20a5 5 0 0 1 7-4.5"/></svg>'],
  ['money','Money','<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>'],
  ['more','More','<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>'],
];
function renderNav(){
  const d=S.data; const newLeads=d.leads.filter(l=>l.status==='New').length;
  const late=d.rent.filter(r=>r.rent_status==='late').length;
  // A count badge plus a red label, so an untouched lead is obvious at a glance.
  $('nav').innerHTML = TABS.map(([k,l,svg])=>{
    const n = k==='leads' ? newLeads : k==='money' ? late : 0;
    return `<button data-tab="${k}" class="${S.tab===k?'on':''}${n?' alert':''}">${svg}${l}${n?`<span class="badge">${n>99?'99+':n}</span>`:''}</button>`;
  }).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.detail=null; render(); $('main').scrollTop=0; });
}
function render(){
  if(!S.data) return;
  renderNav();
  const R = {today:vToday, beds:vBeds, leads:vLeads, tenants:vTenants, money:vMoney, more:vMore};
  $('hdr-title').textContent = TABS.find(t=>t[0]===S.tab)[1];
  $('hdr-sub').textContent = new Date().toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric'});
  $('main').innerHTML = R[S.tab]();
  wire();
}
function wire(){
  document.querySelectorAll('[data-tenant]').forEach(el=>el.onclick=()=>openTenant(el.dataset.tenant));
  document.querySelectorAll('[data-lead]').forEach(el=>el.onclick=()=>openLead(el.dataset.lead));
  document.querySelectorAll('[data-bed]').forEach(el=>el.onclick=()=>openBed(el.dataset.bed));
  // Never let a handler fail silently: a button that errors must say so, not look like it saved.
  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=async(e)=>{ e.stopPropagation();
    try{ await ACT[el.dataset.act](el.dataset.id, el); }
    catch(err){ console.error(el.dataset.act, err); toast('Did not save: '+(err&&err.message||err)); } });
}
const statusPill = (s)=>({paid:'<span class="pill ok">Paid</span>',due:'<span class="pill warn">Due</span>',late:'<span class="pill bad">Late</span>','not started':'<span class="pill muted">Not started</span>','n/a':'<span class="pill muted">n/a</span>'}[s]||'');
const bedPill = (s)=>({Open:'<span class="pill ok">Open</span>',Reserved:'<span class="pill info">Reserved</span>',Occupied:'<span class="pill muted">Occupied</span>'}[s]||'');
// Phone and email each get a Copy button; the email goes into GroupMe and TTLock by hand.
const contactRow = (t)=>`<div class="stack" style="gap:6px">
  <div class="row small">${t.phone?`<a class="btn sm" href="tel:+${phoneDigits(t.phone)}">Call</a><a class="btn sm" href="${gvUrl(t.phone)}" target="_blank" rel="noopener">Text</a>`:''}${t.email?`<a class="btn sm" href="mailto:${esc(t.email)}">Email</a>`:''}</div>
  ${t.phone?`<div class="row small"><span class="mono muted grow" style="overflow-wrap:anywhere">${esc(fmtPhone(t.phone))}</span><button class="btn sm" data-act="copy" data-id="${esc(fmtPhone(t.phone))}">Copy</button></div>`:''}
  ${t.email?`<div class="row small"><span class="mono muted grow" style="overflow-wrap:anywhere">${esc(t.email)}</span><button class="btn sm" data-act="copy" data-id="${esc(t.email)}">Copy</button></div>`:'<div class="small muted">No email on file.</div>'}
</div>`;

// Which beds are free on the 1st of a given month (someone whose stay covers that day blocks it).
function openOn(monthDate){
  const first=iso(monthDate); const last=iso(new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0));
  const busy=new Set(S.data.tenants.filter(t=>t.bed_id&&t.status!=='Moved Out'&&(
      (t.status==='Active'&&(!t.move_out||t.move_out>=first)) ||
      (t.status==='Reserved'&&(!t.move_in||t.move_in<=last)&&(!t.move_out||t.move_out>=first)) )).map(t=>t.bed_id));
  return S.data.beds.filter(b=>!busy.has(b.id));
}
// Tenants who've been here 60+ days and haven't been asked for a review. Shown on Today; "Asked" clears it.
function reviewAsks(){ return S.data.tenants.filter(t=>t.status==='Active'&&!t.review_asked&&t.move_in&&daysSince(t.move_in)>=60); }
function reviewMsg(t){ const first=String(t.name||'').trim().split(' ')[0]; const link=S.data.settings.review_link||''; return `Hi ${first}, glad to have you at the crashpad. If you have a minute, a quick Google review helps a lot with keeping the house full of good crew:${link?' '+link:''} Thanks!`; }

// Before someone moves in: what's still missing. Drives Today and the tenant card.
function moveinTodo(t){
  const todo=[]; const d=S.data;
  if(!t.bed_id) todo.push({label:'Pick a bed', act:'tenantedit', id:t.id, btn:'Edit'});
  if(!t.contract_signed){ const l=d.leads.find(x=>x.tenant_id===t.id); todo.push(l?{label:l.status==='Agreement sent'?'Waiting for signature':'Send the agreement', act:'agropen', id:l.id, btn:l.status==='Agreement sent'?'Open':'Send'}:{label:'Agreement not signed', act:'flagon', id:t.id+'|contract_signed', btn:'Signed'}); }
  if(!t.fee_paid_on) todo.push({label:'$150 reservation fee', act:'feepaid', id:t.id, btn:'Received'});
  const bedTask=d.cleaning.find(c=>c.tenant_id===t.id&&!c.done&&c.task==='Make bed for move-in');
  if(bedTask) todo.push({label:`Bed ${bedTask.bed_id} not made yet (Will)`, act:'cleandone', id:bedTask.id, btn:'Done'});
  if(ttConnected()&&!activeKeys(t.id).length) todo.push(t.email?{label:'Door key', act:'keysend', id:t.id, btn:'Send'}:{label:'Door key (needs email)', act:'tenantedit', id:t.id, btn:'Edit'});
  if(gmConnected()&&!t.groupme_added) todo.push(t.phone?{label:'GroupMe', act:'gmadd', id:t.id, btn:'Add'}:{label:'GroupMe (needs phone)', act:'tenantedit', id:t.id, btn:'Edit'});
  return todo;
}
// Last successful unlock by this person (TTLock events since the hookup).
function lastAtDoor(t){
  const emails=new Set(S.data.doorkeys.filter(k=>k.tenant_id===t.id).map(k=>String(k.receiver).toLowerCase())); if(t.email) emails.add(t.email.toLowerCase());
  const e=S.data.doorlog.find(x=>x.username&&emails.has(String(x.username).toLowerCase()));

function fmtWhen(d){ return d.toLocaleString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
// Rent reminder, ready to paste into Google Voice.
function rentMsg(t, r){
  const first=String(t.name||'').trim().split(' ')[0]; const st=S.data.settings;
  const late=r.rent_status==='late';
  return `Hi ${first}, ${late?'rent for':'a reminder that rent for'} ${monthLabel(S.month)} ${late?'is past due':'is due on the 1st'}: $${Number(r.owed).toLocaleString()}${Number(r.paid)>0?' remaining':''}. Zelle ${st.zelle||''} or Apple Pay ${st.apple_pay||''}, and please put ${t.payment_code||'your bed'} in the note. ${late?'Late fee is $10 plus $5/day after the 5th. ':''}Thanks!`;

// Leads that share a phone or email with another lead or tenant.
function dupOf(l){
  const ph=phoneDigits(l.phone), em=(l.email||'').toLowerCase();
  const other=S.data.leads.find(x=>x.id!==l.id&&((ph&&phoneDigits(x.phone)===ph)||(em&&(x.email||'').toLowerCase()===em)));
  if(other) return {kind:'lead', name:other.name, status:other.status, id:other.id};
  const t=S.data.tenants.find(x=>x.id!==l.tenant_id&&x.status!=='Moved Out'&&((ph&&phoneDigits(x.phone)===ph)||(em&&(x.email||'').toLowerCase()===em)));
  return t?{kind:'tenant', name:t.name, status:t.status, id:t.id}:null;
}

// What's still open after someone moves out. Drives the Today list and the tenant card.
function moveoutTodo(t){
  const todo=[];
  if(t.fee_paid_on && !t.fee_refunded_on && !t.fee_kept)
    todo.push({label:'Refund the $150 reservation fee', act:'feerefund', id:t.id, btn:'Refund', pri:true});
  if(t.groupme_added)
    todo.push(S.data&&gmConnected()
      ? {label:'Remove from the GroupMe', act:'gmremove', id:t.id, btn:'Remove', pri:true}
      : {label:'Remove from the DFW CRASHPADS GroupMe', act:'clearflag', id:t.id+'|groupme_added', btn:'Done'});
  if(S.data&&ttConnected()&&activeKeys(t.id).length)
    todo.push({label:'Remove their TTLock door key', act:'keyremove', id:t.id, btn:'Remove', pri:true});
  else if(t.ttlock_account)
    todo.push({label:'Turn off their TTLock door key', act:'clearflag', id:t.id+'|ttlock_account', btn:'Done'});
  return todo;
}

// ---------- Agreements (sent through the website; server route /app/agreement) ----------
async function agrCall(body){ return serverCall('agreement', body); }
async function serverCall(route, body){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) throw new Error('Sign in again.');
  const r = await fetch(SUPABASE_URL+'/functions/v1/app/'+route, { method:'POST', headers:{ 'content-type':'application/json', 'authorization':'Bearer '+session.access_token, 'apikey':SUPABASE_KEY }, body:JSON.stringify(body) });
  let out={}; try{ out=await r.json(); }catch(e){}
  if(!r.ok || !out.ok) throw new Error(out.message || ('Server said HTTP '+r.status));
  return out;
}
// The agreement is the reservation: make the tenant record match what was sent.
async function holdBed(leadId, b){
  const l=S.data.leads.find(x=>x.id===leadId); if(!l) return;
  const hold={ bed_id:b.bed_id||null, rent:b.rent, move_in:b.move_in, email:b.email, category_hold:b.bed_id?null:(b.category||null), payment_code:b.bed_id?b.bed_id.replace('-',''):null };
  let tid=l.tenant_id;
  try{
    if(!tid){ const same=S.data.tenants.find(x=>x.status!=='Moved Out'&&x.name.trim().toLowerCase()===l.name.trim().toLowerCase()); if(same) tid=same.id; }
    if(tid) await sb.from('cp_tenants').update(hold).eq('id',tid);
    else { const {data}=await sb.from('cp_tenants').insert({name:l.name,status:'Reserved',phone:l.phone,airline:l.airline,...hold}).select('id').single(); tid=data&&data.id; }
    if(tid){
      await sb.from('cp_leads').update({tenant_id:tid}).eq('id',leadId);
      if(b.bed_id){ const task=S.data.cleaning.find(c=>c.tenant_id===tid&&!c.done&&c.task==='Make bed for move-in');
        if(task) await sb.from('cp_cleaning').update({bed_id:b.bed_id,needed_on:b.move_in,notes:`${l.name} arrives ${fmtD(b.move_in)}`}).eq('id',task.id);
        else await sb.from('cp_cleaning').insert({needed_on:b.move_in,bed_id:b.bed_id,task:'Make bed for move-in',tenant_id:tid,tenant_name:l.name,notes:`${l.name} arrives ${fmtD(b.move_in)}`}); }
    }
  }catch(e){ console.error('holdBed',e); }
}

  try{

    agrBox(`<div class="small" style="color:var(--bad)">Couldn't reach the website: ${esc(e.message)}</div><div class="row" style="margin-top:8px"><button class="btn sm" data-act="agrretry" data-id="${leadId}">Try again</button><button class="btn sm" data-act="agrformnow" data-id="${leadId}">Send one anyway</button></div>`);

// ---------- More (stats + settings) ----------
function vMore(){
  const d=S.data;
  const total=d.beds.length, occ=d.beds.filter(b=>b.status==='Occupied').length, res=d.beds.filter(b=>b.status==='Reserved').length;
  const now=firstOfMonth(new Date());
  const months=[-5,-4,-3,-2,-1,0].map(n=>addMonths(now,n));
  const income=months.map(m=>{const k=iso(m);return d.payments.filter(p=>p.for_month===k&&p.type!=='Refund').reduce((a,p)=>a+Number(p.amount),0);});
  const max=Math.max(1,...income);
  const since=iso(addMonths(now,-3));
  const moveouts=d.tenants.filter(t=>t.status==='Moved Out'&&t.move_out&&t.move_out>=since).length;
  const active=d.tenants.filter(t=>t.status==='Active').length;
  const churn=active?Math.round(100*moveouts/(active+moveouts)):0;
  const potential=d.beds.reduce((a,b)=>a+b.list_price,0);
  const list=d.tenants.filter(t=>t.status==='Active');
  const tenure=list.filter(t=>t.move_in).map(t=>(Date.now()-new Date(t.move_in))/2629800000);
  const avgT=tenure.length?(tenure.reduce((a,b)=>a+b,0)/tenure.length):0;
  return `<div class="stack">
    <h3>Stats</h3>
    ${nightlyCard()}
    <div class="tiles">
      <div class="tile"><div class="n">${Math.round(100*occ/total)}%</div><div class="l">Occupancy</div></div>

      <div class="small muted" style="margin-top:6px">${occ} occupied, ${res} reserved, ${total-occ-res} open. Full house at list price: ${money(potential)}/mo.</div></div>
    ${ttlockCard()}
    ${groupmeCard()}
    <h3>Settings <span class="small muted" style="text-transform:none;letter-spacing:0">· app version ${APP_VERSION}</span></h3>
    <div class="card stack">

      <label class="f">Google review link (for the review request text)<input id="st-review" value="${esc(d.settings.review_link||'')}" placeholder="https://g.page/r/..."></label>
      <button class="btn" data-act="settingssave" data-id="x">Save settings</button>

      <button class="btn" data-act="signout" data-id="x">Sign out</button>

function keyMsg(t, email){
  const first=String(t.name||'').trim().split(' ')[0];
  return `Hi ${first}, your DFW Crashpads door key is ready in the TTLock app. Sign in with ${email}. If you're new to TTLock, your account was just created for you and the starting password is the last 6 characters of your email (${email.slice(-6)}). Please change it after you sign in. The key works from your move-in date.`;
}
function keySentSheet(t, email, detail){
  S.keyMsg=keyMsg(t,email);
  sheet(`<h2>Door key sent</h2><div class="stack">
    <div class="small muted" style="white-space:pre-line">${esc(detail||'')}</div>
    <div class="card small">${esc(S.keyMsg)}</div>
    ${t.phone?`<button class="btn" data-act="copynum" data-id="${t.id}">Copy number ${esc(fmtPhone(t.phone))}</button><a class="btn pri" href="${gvUrl(t.phone)}" target="_blank" rel="noopener" data-act="keymsgcopy" data-id="x">Copy message + open Google Voice</a><div class="small muted">Google Voice opens with the message copied. Tap the message box and paste.</div>`:`<button class="btn" data-act="keymsgcopy" data-id="x">Copy message</button>`}
  </div>`); wire();
}
// ---------- Average nightly (from TTLock unlocks) ----------
function nightlyCard(){
  const n=S.data.nightly; if(!n.length) return '';
  const max=Math.max(1,...n.map(r=>Number(r.avg_guests)));
  return `<div class="card"><div class="row"><span class="grow"><b>Average nightly</b></span><span class="mono" style="font-size:20px">${Number(n[0].avg_guests).toFixed(1)}</span></div>
    <div class="small muted" style="margin:2px 0 8px">Unique tenants who unlocked the front door each day, averaged by month. Housekeeping and family excluded.</div>
    ${n.map(r=>`<div class="row small" style="margin:3px 0"><span style="width:56px">${monthLabel(new Date(r.month+'T12:00:00')).replace(' 20',' ')}</span><div class="bar grow"><i style="width:${100*Number(r.avg_guests)/max}%"></i></div><span class="mono" style="width:76px;text-align:right">${Number(r.avg_guests).toFixed(1)} <span class="muted">/ ${r.max_guests}</span></span></div>`).join('')}
    <div class="small muted" style="margin-top:6px">Right column: average / busiest day. ${n[0].days<28?`${monthLabel(new Date(n[0].month+'T12:00:00'))} so far: ${n[0].days} days.`:''}</div></div>`;
}

// ---------- GroupMe ----------
const gmConnected = ()=>!!(S.data.settings.groupme_connected);
function groupmeCard(){
  if(gmConnected()) return `<h3>GroupMe</h3><div class="card stack"><div class="small">Connected to <b>${esc(S.data.settings.groupme_connected)}</b>. Tenants are added at move-in and removed at move-out.</div>
    <details><summary class="small muted">Reconnect</summary><div style="margin-top:8px">${gmForm()}</div></details></div>`;
  return `<h3>GroupMe</h3><div class="card">${gmForm()}</div>`;
}
function gmForm(){ return `<div class="stack"><div class="small muted">On dev.groupme.com, sign in and tap <b>Access Token</b> (top right). Paste it here. It's saved on the server only.</div>
  <label class="f">GroupMe access token<input id="gm-token" type="password" autocomplete="off"></label>
  <div id="gm-err" class="small" style="color:var(--bad)" hidden></div><div id="gm-pick"></div>
  <button class="btn pri" data-act="gmconnect" data-id="">Connect GroupMe</button></div>`; }
function groupmeRow(t){
  if(!gmConnected()||t.status==='Moved Out'&&!t.groupme_added) return '';
  return `<div class="row small" style="margin-top:6px"><span class="grow">GroupMe: ${t.groupme_added?'in the group':'not added'}</span>
    ${t.groupme_added?`<button class="btn sm danger" data-act="gmremove" data-id="${t.id}">Remove</button>`:(t.status!=='Moved Out'?`<button class="btn sm" data-act="gmadd" data-id="${t.id}">Add to group</button>`:'')}</div>`;
}

function ttlockCard(){
  const d=S.data;
  const form=`<div class="stack">
      <div class="small muted">From open.ttlock.com (your app's page): Client ID and Client Secret. Then the email/phone and password you use in the TTLock phone app. The password is used once to connect and is not saved.</div>
      <label class="f">Client ID<input id="tt-cid" autocomplete="off" autocapitalize="off"></label>
      <label class="f">Client Secret<input id="tt-sec" type="password" autocomplete="off"></label>
      <label class="f">TTLock app login (email or phone)<input id="tt-user" autocomplete="off" autocapitalize="off"></label>
      <label class="f">TTLock app password<input id="tt-pass" type="password" autocomplete="off"></label>
      <div id="tt-err" class="small" style="color:var(--bad)" hidden></div>
      <button class="btn pri" data-act="ttconnect" data-id="x">Connect TTLock</button>
    </div>`;
  const cb=`<div class="small" style="margin-top:8px">Callback URL for open.ttlock.com:<div class="row" style="margin-top:4px"><span class="mono small grow" style="word-break:break-all">${esc(TTLOCK_CALLBACK)}</span><button class="btn sm" data-act="ttcbcopy" data-id="x">Copy</button></div></div>`;

    <div class="small muted">Tenants get a key to each checked lock when you send one. Keys are removed at move-out.</div>
    ${d.locks.map(l=>`<label class="chk"><input type="checkbox" data-act="locktoggle" data-id="${l.lock_id}" ${l.give_tenants?'checked':''}> <span class="grow">${esc(l.name||('Lock '+l.lock_id))}</span><span class="small muted">${l.battery!=null?l.battery+'% battery':''}${l.has_gateway?' · gateway':''}</span></label>`).join('')}

function doorKeyCard(t){
  if(!ttConnected()||t.status==='Moved Out'&&!activeKeys(t.id).length) return '';
  const keys=activeKeys(t.id);
  const lockName=(id)=>(S.data.locks.find(l=>Number(l.lock_id)===Number(id))||{}).name||('Lock '+id);
  return `<div class="card"><h3>Door key</h3><div style="margin-top:6px">
    ${keys.length?keys.map(k=>`<div class="small">${esc(lockName(k.lock_id))}: sent to ${esc(k.receiver)} ${fmtD(k.sent_at)}</div>`).join(''):'<div class="small muted">No key sent yet.</div>'}
    <div class="row" style="margin-top:8px">
      ${t.status!=='Moved Out'?`<button class="btn sm ${keys.length?'':'pri'}" data-act="keysend" data-id="${t.id}">${keys.length?'Send again':'Send door key'}</button>`:''}
      ${keys.length?`<button class="btn sm danger" data-act="keyremove" data-id="${t.id}">Remove key</button>`:''}
    </div></div></div>`;
}

const PAY_METHODS = ['Venmo','Zelle','Apple Pay','Cash App','PayPal','Cash','Other'];
// Move-in month prorated at rent / 30 per day, move-in date through month end (never more than the rent).
function prorated(rent, moveIn){ if(!rent||!moveIn) return null; const d=new Date(moveIn+'T12:00:00'); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); const days=last-d.getDate()+1; return { amt:Math.min(rent,Math.round(rent*days/30)), days }; }

  fullmonth:()=>{ $('tf-first').value=''; $('tf-first-hint').textContent='Full rent for the move-in month.'; },

  agrgv:(id)=>{ const l=S.data.leads.find(x=>x.id===id); const msg=agrMsg(l,S.agrUrl||''); try{ navigator.clipboard.writeText(msg).then(()=>toast('Message copied. Paste it in Google Voice.'),()=>{}); }catch(e){} },

  agrsend:async(id,el)=>{
    const err=$('ag-err'); const show=(m)=>{ err.textContent=m; err.hidden=false; };
    const body={ action:'send', lead_id:id, email:$('ag-email').value.trim(), bed_id:$('ag-bed').value, category:$('ag-cat').value, rent:Number($('ag-rent').value)||0, move_in:$('ag-move').value };
    if(!/^\S+@\S+\.\S+$/.test(body.email)) return show('Add their email.');

    if(!body.move_in) return show('Add the move-in date.');
    el.disabled=true; el.textContent='Sending…';

      openLead(id);

    sheet(`<h2>Edit payment</h2><div class="stack"><div class="small muted">${esc(p.tenant_name||'')}</div>
      <div class="grid2"><label class="f">Amount $<input id="pe-amount" inputmode="decimal" value="${esc(p.amount)}"></label><label class="f">Received<input id="pe-date" type="date" value="${esc(p.received_on||'')}"></label></div>
      <div class="grid2"><label class="f">Method<select id="pe-method">${PAY_METHODS.map(o=>`<option ${p.method===o?'selected':''}>${o}</option>`).join('')}</select></label><label class="f">Type<select id="pe-type">${['Rent','Reservation fee','Late fee','Refund','Other'].map(o=>`<option ${p.type===o?'selected':''}>${o}</option>`).join('')}</select></label></div>
      <label class="f">For month<select id="pe-month">${months.map(m=>`<option value="${m}" ${p.for_month===m?'selected':''}>${monthLabel(new Date(m+'T12:00:00'))}</option>`).join('')}</select></label>
      <label class="f">Note<input id="pe-note" value="${esc(p.note||'')}"></label>
      <div class="row"><button class="btn pri" data-act="paysaveedit" data-id="${id}">Save</button><button class="btn danger" data-act="paydelete" data-id="${id}">Delete</button></div></div>`); wire(); },
  paysaveedit:async(id)=>{ const p=S.data.payments.find(x=>x.id===id); const amt=Number($('pe-amount').value); if(!amt) return toast('Amount?');
    const v={amount:amt,received_on:$('pe-date').value||p.received_on,method:$('pe-method').value,type:$('pe-type').value,for_month:$('pe-month').value,note:$('pe-note').value.trim()||null};
    closeSheet(); await run(sb.from('cp_payments').update(v).eq('id',id),'Payment updated'); if(p.tenant_id&&S.tab==='tenants') openTenant(p.tenant_id); },
  feerefund:(id)=>{ const t=tenantById(id); sheet(`<h2>Refund ${esc(t.name)}</h2><div class="stack">
      <div class="grid2"><label class="f">Amount $<input id="rf-amt" inputmode="decimal" value="150"></label><label class="f">Sent on<input id="rf-date" type="date" value="${today()}"></label></div>
      <label class="f">How<select id="rf-method">${PAY_METHODS.map(o=>`<option>${o}</option>`).join('')}</select></label>
      <label class="f">Note<input id="rf-note" placeholder="Optional"></label>
      <button class="btn pri" data-act="feerefundsave" data-id="${id}">Log the refund</button>
      <hr class="hr">
      <div class="small muted">Not refunding this one? Late notice, or they cancelled before staying.</div>
      <button class="btn" data-act="feekeep" data-id="${id}">Keeping the fee</button>
    </div>`); wire(); },
  feerefundsave:async(id)=>{ const t=tenantById(id); const amt=Math.abs(Number($('rf-amt').value))||0; if(!amt) return toast('Amount?');
    const on=$('rf-date').value||today(); const note=$('rf-note').value.trim()||null; const method=$('rf-method').value; closeSheet();
    await run(sb.from('cp_payments').insert({tenant_id:id,tenant_name:t.name,amount:-amt,method,for_month:null,type:'Refund',received_on:on,note:note||'Reservation fee refunded at move-out'}));
    await run(sb.from('cp_tenants').update({fee_refunded_on:on}).eq('id',id),'Refund logged'); },
  feeunkeep:async(id)=>{ closeSheet(); await run(sb.from('cp_tenants').update({fee_kept:false}).eq('id',id),'Back on the list'); openTenant(id); },
  feekeep:(id)=>confirmSheet('Keep the $150 instead of refunding it? This just clears the reminder, no payment is logged.',async()=>{ closeSheet(); await run(sb.from('cp_tenants').update({fee_kept:true}).eq('id',id),'Fee kept'); }),
  movein:(id)=>{ const t=tenantById(id); sheet(`<h2>Move in ${esc(t.name)}</h2><div class="stack">
      <div class="small muted">Bed <span class="mono">${esc(t.bed_id||'none yet')}</span>. This sets them Active as of today.</div>
      ${!t.bed_id?`<div class="pill bad">Assign a bed first (Edit tenant)</div>`:''}
      ${gmConnected()&&!t.groupme_added?(t.phone?`<label class="chk"><input type="checkbox" id="mi-gm" checked> Add to GroupMe and post a welcome</label>`:`<div class="pill warn">Add their phone to add them to GroupMe</div>`):''}
      ${ttConnected()&&!activeKeys(t.id).length?(t.email?`<label class="chk"><input type="checkbox" id="mi-key" checked> Send door key to ${esc(t.email)}</label>`:`<div class="pill warn">Add their email to send a door key</div>`):''}
      ${ttConnected()&&gmConnected()?'':`<div class="card small">Then, by hand:<br>${ttConnected()?'':`· Text them to install TTLock and make an account with ${esc(t.email||'their email')}, then send their eKey.<br>`}${gmConnected()?'':'· Add them to the DFW CRASHPADS GroupMe.<br>'}Tick the boxes on their card when done.</div>`}
      <button class="btn pri" data-act="moveinconfirm" data-id="${id}" ${!t.bed_id?'disabled':''}>Mark moved in</button></div>`); wire(); },
  moveinconfirm:async(id)=>{ const sendKey=$('mi-key')&&$('mi-key').checked; const addGm=$('mi-gm')&&$('mi-gm').checked; const t=tenantById(id); closeSheet();
    await run(sb.from('cp_tenants').update({status:'Active',move_in:t.move_in||today()}).eq('id',id),'Moved in');
    if(addGm){ try{ const out=await serverCall('groupme',{action:'add',tenant_id:id,welcome:true}); toast(out.message); }catch(e){ toast('Moved in, but GroupMe failed: '+e.message); } }
    if(sendKey){ try{ const out=await serverCall('ttlock',{action:'sendkey',tenant_id:id}); await load(); keySentSheet(tenantById(id), t.email.toLowerCase(), out.message); return; }catch(e){ toast('Moved in, but the door key failed: '+e.message); } }
    openTenant(id); },
  notice:(id)=>{ const t=tenantById(id); const def=iso(new Date(new Date().getFullYear(),new Date().getMonth()+1,0)); sheet(`<h2>Log notice</h2><div class="stack"><label class="f">Last night<input id="nt-date" type="date" value="${def}"></label><label class="f">What they said<input id="nt-text" placeholder="Texted: moving out end of month"></label><button class="btn pri" data-act="noticesave" data-id="${id}">Save notice</button></div>`); wire(); },
  noticesave:async(id)=>{ const t=tenantById(id); const out=$('nt-date').value; const txt=$('nt-text').value.trim(); closeSheet();
    await run(sb.from('cp_tenants').update({move_out:out,notice_given_on:today()}).eq('id',id));
    const next=new Date(out+'T12:00:00'); next.setDate(next.getDate()+1);
    await sb.from('cp_cleaning').insert({needed_on:iso(next),bed_id:t.bed_id,task:'Strip after move-out',tenant_id:id,tenant_name:t.name,notes:`${t.name} leaves ${fmtD(out)}`});
    if(txt) await sb.from('cp_contact_log').insert({tenant_id:id,who:t.name,channel:'Text',summary:txt,tag:'notice',key_date:out});
    toast('Notice logged'); await load(); openTenant(id); },
  moveout:(id)=>{ const t=tenantById(id); sheet(`<h2>Move out ${esc(t.name)}</h2><div class="stack"><div class="small">Sets them Moved Out and frees <span class="mono">${esc(t.bed_id||'')}</span>.</div><div class="card small">These stay on Today under <b>Move-out follow-ups</b> until you tick them off:${t.fee_paid_on&&!t.fee_refunded_on&&!t.fee_kept?'<br>· Refund the $150 (within 30 days if they gave notice by the 15th)':''}${t.groupme_added&&!gmConnected()?'<br>· Remove from GroupMe':''}${t.ttlock_account&&!(ttConnected()&&activeKeys(t.id).length)?'<br>· Turn off their TTLock key':''}</div>${ttConnected()&&activeKeys(t.id).length?'<div class="small">Their door key is removed automatically.</div>':''}${gmConnected()&&t.groupme_added?'<div class="small">They are removed from GroupMe automatically.</div>':''}<button class="btn pri" data-act="moveoutconfirm" data-id="${id}">Mark moved out</button></div>`); wire(); },
  moveoutconfirm:async(id)=>{ const t=tenantById(id); const hadKeys=ttConnected()&&activeKeys(id).length; const inGm=gmConnected()&&t.groupme_added; closeSheet();
    await run(sb.from('cp_tenants').update({status:'Moved Out',move_out:t.move_out||today()}).eq('id',id),'Moved out');
    if(inGm){ try{ await serverCall('groupme',{action:'remove',tenant_id:id}); }catch(e){ toast('Moved out, but GroupMe removal failed: '+e.message); } }
    if(hadKeys){ try{ await serverCall('ttlock',{action:'removekey',tenant_id:id}); toast('Moved out. Door key removed.'); }catch(e){ toast('Moved out, but removing the door key failed: '+e.message); } await load(); } },
  clearflag:async(arg)=>{ const [id,k]=arg.split('|'); await run(sb.from('cp_tenants').update({[k]:false}).eq('id',id),'Checked off'); if($('sheet')&&S.detail===id) openTenant(id); },
  assign:(bedId)=>{ const cands=S.data.tenants.filter(t=>t.status!=='Moved Out'&&t.bed_id!==bedId); const b=S.data.beds.find(x=>x.id===bedId);
    sheet(`<h2>Assign ${bedId}</h2><div class="stack"><label class="f">Tenant<select id="as-t"><option value="">Choose…</option>${cands.map(t=>`<option value="${t.id}">${esc(t.name)} (${t.status}${t.bed_id?', now '+t.bed_id:''})</option>`).join('')}</select></label><label class="f">Rent $/mo<input id="as-rent" inputmode="numeric" value="${b.list_price}"></label><button class="btn pri" data-act="assignsave" data-id="${bedId}">Assign</button><button class="btn" data-act="addtenant" data-id="x">Or add a new tenant</button></div>`); wire(); },
  assignsave:async(bedId)=>{ const tid=$('as-t').value; if(!tid) return toast('Pick a tenant'); const rent=Number($('as-rent').value)||0; closeSheet(); await run(sb.from('cp_tenants').update({bed_id:bedId,rent,payment_code:bedId.replace('-',''),category_hold:null}).eq('id',tid),'Assigned'); },
  bednotes:async(id)=>{ const v=$('bed-notes').value.trim()||null; closeSheet(); await run(sb.from('cp_beds').update({notes:v}).eq('id',id),'Saved'); },
  pay:(id)=>{ sheet(payForm(id||null)); wire(); },
  // Read every field BEFORE closeSheet(): it removes the inputs from the page.
  paysave:async()=>{ const fromInbox=S.inboxEdit; S.inboxEdit=null; if(fromInbox) await sb.from('cp_payment_inbox').update({status:'accepted',resolved_at:new Date().toISOString()}).eq('id',fromInbox); const tid=$('pf-tenant').value; const t=tenantById(tid); const amt=Number($('pf-amount').value);
    const method=$('pf-method').value, forMonth=$('pf-month').value, type=$('pf-type').value,
          on=$('pf-date').value||today(), note=$('pf-note').value.trim()||null;
    if(!amt) return toast('Amount?');
    if(!t) return toast('Pick a tenant');
    closeSheet();
    await run(sb.from('cp_payments').insert({tenant_id:tid,tenant_name:t.name,amount:amt,method,for_month:forMonth,type,received_on:on,note}),'Payment logged');
    if(type==='Reservation fee'&&!t.fee_paid_on) await run(sb.from('cp_tenants').update({fee_paid_on:on}).eq('id',tid)); },
  paydelete:(id)=>confirmSheet('Delete this payment?',async()=>{ closeSheet(); await run(sb.from('cp_payments').delete().eq('id',id),'Deleted'); }),
  copy:async(txt)=>{ try{ await navigator.clipboard.writeText(txt); toast('Copied '+txt); }
    catch(e){ sheet(`<h2>Copy</h2><div class="stack"><textarea id="cp-t" style="width:100%;min-height:60px" readonly>${esc(txt)}</textarea><div class="small muted">Tap and hold to copy.</div></div>`); const el=$('cp-t'); if(el){ el.focus(); el.setSelectionRange(0,el.value.length); } } },
  cleandone:async(id)=>{ await run(sb.from('cp_cleaning').update({done:true}).eq('id',id)); },
  cleantext:async()=>{ const c=S.data.cleaning.filter(x=>!x.done); const lines=c.map(x=>`- ${x.bed_id}: ${x.task.toLowerCase()}${x.tenant_name?' ('+x.tenant_name+')':''}${x.needed_on?' by '+fmtD(x.needed_on):''}`);
    const txt=`Hey Will, for this week:\n${lines.join('\n')}\nThanks!`; try{ await navigator.clipboard.writeText(txt); toast('Copied for Will'); }catch(e){ sheet(`<h2>Text for Will</h2><textarea style="width:100%;min-height:160px">${esc(txt)}</textarea>`); }
    await sb.from('cp_cleaning').update({cleaners_notified:true}).in('id',c.map(x=>x.id)); },
  settingssave:async()=>{ await run(sb.from('cp_settings').upsert([{key:'wp_api_key',value:$('st-wp').value.trim()},{key:'cleaner_phone',value:$('st-cphone').value.trim()},{key:'review_link',value:$('st-review').value.trim()}]),'Settings saved'); },
  passchange:async()=>{ const p=$('st-pass').value; if(p.length<8) return toast('Use at least 8 characters'); const {error}=await sb.auth.updateUser({password:p}); toast(error?error.message:'Password changed'); $('st-pass').value=''; },
  signout:()=>sb.auth.signOut(),
};
function confirmSheet(msg,fn){ sheet(`<h2>Confirm</h2><div class="stack"><div>${esc(msg)}</div><div class="row"><button class="btn danger" id="cf-yes">Yes, do it</button><button class="btn" id="cf-no">Cancel</button></div></div>`); $('cf-yes').onclick=fn; $('cf-no').onclick=closeSheet; }
</script>
</body>
</html>
