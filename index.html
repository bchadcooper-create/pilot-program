<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flight Crew Fitness">
    <meta name="theme-color" content="#0d1b2a">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Flight Crew Fitness</title>
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="/pilot-program/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .hidden { display: none !important; }
        .tab-active { color: #3b82f6; border-top: 2px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans select-none">

    <main id="app" class="flex-grow overflow-y-auto pb-20 p-4 max-w-md mx-auto w-full">
        <div id="view-dashboard" class="space-y-6">
            <h1 class="text-2xl font-bold">Flight Crew Fitness</h1>
            <p>System Initializing...</p>
        </div>
        <div id="view-workout" class="hidden"></div>
        <div id="view-export" class="hidden"></div>
        <div id="view-postflight" class="hidden"></div>
    </main>

    <nav class="bg-gray-900 border-t border-gray-800 fixed bottom-0 w-full z-40 pb-safe">
        <div class="max-w-md mx-auto flex justify-around text-xs font-semibold text-gray-500">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-4 tab-active">Dashboard</button>
            <button onclick="switchTab('workout')" id="tab-workout" class="flex-1 py-4">Workout</button>
            <button onclick="switchTab('export')" id="tab-export" class="flex-1 py-4">Route Review</button>
        </div>
    </nav>

    <script src="/pilot-program/app.js"></script>
    
    <script>
        // Final Init Hook
        window.addEventListener('load', () => {
            if (typeof window.init === 'function') {
                window.init();
            } else {
                console.error("Initialization failed: app.js loaded but window.init is missing.");
            }
        });
    </script>
</body>
</html>
