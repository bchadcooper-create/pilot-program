function getMedia(id){
  if(MEDIA[id]) return MEDIA[id];
  const n=id.toLowerCase();
  if((n.includes('squat')&&!n.includes('goblet')&&!n.includes('split')&&!n.includes('hack')&&!n.includes('jump'))||n==='st_squat'||n==='jm_squat') return MEDIA.squat;
  if(n.includes('deadlift')&&!n.includes('rdl')&&!n.includes('roman')&&!n.includes('nordic')&&!n.includes('trap')&&!n.includes('tb')) return MEDIA.deadlift;
  if(n.includes('rdl')||n.includes('romanian')) return MEDIA.rdl;
  if(n.includes('tbdl')||n.includes('trap_bar')||n.includes('trap bar')) return MEDIA.tbdl;
  if(n.includes('nordic')) return MEDIA.nordic;
  if(n.includes('bench')&&!n.includes('inc')&&!n.includes('bench_jump')&&!n.includes('bench/')) return MEDIA.bench;
  if(n.includes('incline')||n.includes('incdb')||n.includes('_inc')) return MEDIA.incdb;
  if(n.includes('pullup')||n.includes('pull_up')||n.includes('chin')||n.includes('pullups')) return MEDIA.pullup;
  if(n.includes('pulldown')||n.includes('latpd')) return MEDIA.latpd;
  if(n.includes('pushup')||n.includes('push_up')||n.includes('_pu')||n.includes('pike')) return MEDIA.pushup;
  if(n.includes('lunge')) return MEDIA.lunge;
  if(n.includes('plank')||n.includes('hollow')||n.includes('l-sit')||n.includes('dead_bug')||n.includes('bird')) return MEDIA.plank;
  if(n.includes('dip')) return MEDIA.dip;
  if(n.includes('burpee')) return MEDIA.burpee;
  if(n.includes('bss')||n.includes('bulgarian')||n.includes('split_sq')) return MEDIA.bss;
  if(n.includes('goblet')) return MEDIA.goblet;
  if(n.includes('facepull')||n.includes('face_pull')) return MEDIA.facepull;
  if(n.includes('cabrow')||n.includes('_row')||n.includes('barrow')) return MEDIA.cabrow;
  if(n.includes('ohp')||n.includes('overhead')||n.includes('military')||n.includes('_ohp')) return MEDIA.ohp;
  if(n.includes('curl')&&!n.includes('nordic')) return MEDIA.curl;
  if(n.includes('latrise')||n.includes('lateral')) return MEDIA.latrise;
  if(n.includes('calf')) return MEDIA.calf;
  if(n.includes('stepup')||n.includes('step_up')||n.includes('step-up')) return MEDIA.stepup;
  if(n.includes('legpress')||n.includes('leg_press')) return MEDIA.legpress;
  if(n.includes('hipt')||n.includes('hip_thrust')||n.includes('hipthrust')) return MEDIA.hipt;
  if(n.includes('boxjump')||n.includes('box_jump')||n.includes('bjump')||n.includes('bench/box')||n.includes('benchjump')) return MEDIA.boxjump;
  if(n.includes('farmer')||n.includes('carry')) return MEDIA.farmer;
  if(n.includes('swing')) return MEDIA.swing;
  if(n.includes('thruster')) return MEDIA.thruster;
  if(n.includes('leg_curl')||n.includes('legcurl')) return MEDIA.legcurl;
  if(n.includes('leg_ext')||n.includes('legext')) return MEDIA.legext;
  if(n.includes('skull')) return MEDIA.skull;
  if(n.includes('pressdown')||n.includes('tpd')) return MEDIA.tpd;
  if(n.includes('hack')) return MEDIA.hack;
  return null;
}

const ROT=['A','B','C','D'];

// ─── SUPABASE DB DRIVERS ──────────────────────────────────────────────────────
let sb=null,sbUser=null;
function initSB(){
  if(SB_URL==='YOUR_SUPABASE_URL')return false;
  try{
    if(typeof supabase==='undefined')return false;
    sb=supabase.createClient(SB_URL,SB_ANON);return true;
  }catch{return false;}
}
async function checkAuth(){
  if(!sb) return null;
  try {
    const {data:{session}} = await sb.auth.getSession();
    return session?.user || null;
  } catch (err) {
    console.error("Supabase link breakdown:", err);
    return null;
  }
}
async function doSignIn(e,p){const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error;return data.user;}
async function doSignUp(e,p){const{data,error}=await sb.auth.signUp({email:e,password:p});if(error)throw error;return data.user;}
async function doSignOut(){await sb.auth.signOut();sbUser=null;ST.sessions=[];ST.cur=null;ST.page='auth';render();}

// ─── LOCAL STORAGE OVERRIDES ───────────────────────────────────────────────────
const LS={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  keys(p){try{return Object.keys(localStorage).filter(k=>k.startsWith(p));}catch{return[];}},
};
async function dbGetProfile(){if(!sb||!sbUser)return LS.get('fcf_profile');const{data}=await sb.from('user_profiles').select('*').eq('user_id',sbUser.id).maybeSingle();return data?.profile_data||null;}
async function dbSetProfile(p){if(!sb||!sbUser){LS.set('fcf_profile',p);return;}await sb.from('user_profiles').upsert({user_id:sbUser.id,profile_data:p,updated_at:new Date().toISOString()},{onConflict:'user_id'});}
async function dbGetCur(){if(!sb||!sbUser)return LS.get('fcf_cur');const{data}=await sb.from('current_workout').select('*').eq('user_id',sbUser.id).maybeSingle();return data?.workout_data||null;}
async function dbSetCur(w){if(!sb||!sbUser){LS.set('fcf_cur',w);return;}await sb.from('current_workout').upsert({user_id:sbUser.id,workout_data:w,updated_at:new Date().toISOString()},{onConflict:'user_id'});}
async function dbGetSessions(){if(!sb||!sbUser){return LS.keys('fcf_s:').map(k=>LS.get(k)).filter(Boolean).sort((a,b)=>a.started-b.started);}const{data}=await sb.from('workout_sessions').select('*').eq('user_id',sbUser.id).order('started_at',{ascending:true});return(data||[]).map(r=>r.session_data);}
async function dbSaveSession(s){if(!sb||!sbUser){LS.set('fcf_s:'+s.started,s);return;}await sb.from('workout_sessions').upsert({user_id:sbUser.id,session_key:String(s.started),session_data:s,started_at:new Date(s.started).toISOString(),workout_key:s.key||'?'},{onConflict:'user_id,session_key'});}
async function dbGetWeights(){if(!sb||!sbUser)return LS.get('fcf_wts')||[];const{data}=await sb.from('weight_log').select('*').eq('user_id',sbUser.id).order('logged_at',{ascending:true});return(data||[]).map(r=>({date:r.logged_at,weight:r.weight_lb,waist:r.waist_in}));}
async function dbLogWeight(w,waist){if(!sb||!sbUser){const a=LS.get('fcf_wts')||[];a.push({date:new Date().toISOString(),weight:w,waist:waist||null});LS.set('fcf_wts',a);return;}await sb.from('weight_log').insert({user_id:sbUser.id,weight_lb:w,waist_in:waist||null,logged_at:new Date().toISOString()});}

// ─── STATE ENGINE ─────────────────────────────────────────────────────────────
let ST={
  page:'workout',gymType:'commercial',hotelOpt:'hotel1',
  cur:null,expanded:{},modal:null,
  trendEx:null,trendMode:'exercise',
  sessions:[],weights:[],profile:null,
  loaded:false,authMode:'signin',authEmail:'',authPass:'',authErr:'',
  profEdit:false,profDraft:null,newWt:'',newWaist:'',
  showAddEx:false,
};

// ─── LIFECYCLE INITIALIZATION ─────────────────────────────────────────────────
async function init(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/pilot-program/sw.js').catch(()=>{});
  }
  const ok=initSB();
  if(ok) sbUser=await checkAuth();
  if(!ok){ST.page='setup';ST.loaded=true;render();return;}
  if(!sbUser){ST.page='auth';ST.loaded=true;render();return;}
  await loadData();
}

async function loadData(){
  [ST.profile,ST.sessions,ST.cur,ST.weights]=await Promise.all([dbGetProfile(),dbGetSessions(),dbGetCur(),dbGetWeights()]);
  if(!ST.profile){ST.page='profile';ST.profEdit=true;}
  else if(!ST.cur) await startNext();
  ST.loaded=true;render();
}

async function startNext(){
  const goal=ST.profile?.goal||'strength';
  const done=ST.sessions.filter(s=>s.complete&&s.goal===goal);
  let ri=0;if(done.length) ri=(done[done.length-1].rotIdx+1)%ROT.length;
  ST.cur={rotIdx:ri,key:ROT[ri],goal,started:Date.now(),sets:{},customExercises:[],complete:false};

// ─── CALCULATED PROPERTY HELPERS ──────────────────────────────────────────────
function getGD(){return WK[ST.profile?.goal||'strength'];}
function getGymKey(){return ST.gymType==='commercial'?'commercial':ST.hotelOpt;}
function getWD(){
  const gd=getGD();if(!gd||!ST.cur)return null;
  const day=gd[ST.cur.key];if(!day)return null;
  return day[getGymKey()]||day.commercial;
}

function getLevelExercises(exercises){
  const limit=LEVEL_LIMIT[ST.profile?.level||'intermediate'];
  return exercises.slice(0,limit);
}

function lastWt(exKey){
  for(let i=ST.sessions.length-1;i>=0;i--){
    const s=ST.sessions[i];if(!s.sets||!s.sets[exKey])continue;
    const ws=s.sets[exKey].map(x=>parseFloat(x.weight)||0).filter(w=>w>0);
    if(ws.length)return Math.max(...ws);
  }return null;
}
function lastTime(exKey){
  for(let i=ST.sessions.length-1;i>=0;i--){
    const s=ST.sessions[i];if(!s.sets||!s.sets[exKey])continue;
    const ts=s.sets[exKey].map(x=>parseFloat(x.seconds)||0).filter(t=>t>0);
    if(ts.length)return Math.max(...ts);
  }return null;
}

function allExs(){
  const all=[],seen=new Set();
  for(const goal of Object.values(WK))
    for(const day of Object.values(goal))
      if(day&&typeof day==='object')
        for(const gym of Object.values(day))
          if(gym?.exercises)
            for(const ex of gym.exercises)
              if(!seen.has(ex.id)){seen.add(ex.id);all.push(ex);}
  return all;
}
function trendPts(exKey){
  return ST.sessions
    .filter(s=>s.sets&&s.sets[exKey]&&s.sets[exKey].some(x=>parseFloat(x.weight)>0||parseFloat(x.seconds)>0))
    .map(s=>{
      const sets=s.sets[exKey];
      const ws=sets.map(x=>parseFloat(x.weight)||0).filter(w=>w>0);
      const ts=sets.map(x=>parseFloat(x.seconds)||0).filter(t=>t>0);
      const vol=sets.reduce((a,x)=>a+(parseFloat(x.weight)||0)*(parseFloat(x.reps)||0),0);
      return{date:new Date(s.started),maxW:ws.length?Math.max(...ws):0,maxT:ts.length?Math.max(...ts):0,vol:Math.round(vol)};
    });
}
function doneCount(){
  const w=getWD();if(!w||!ST.cur)return 0;
  const exs=getLevelExercises(w.exercises);
  const std=exs.filter(ex=>{const s=ST.cur.sets[ex.id];return s&&s.some(x=>x.reps||x.weight||x.seconds);}).length;
  const cust=(ST.cur.customExercises||[]).filter(ex=>{const s=ST.cur.sets['c_'+ex.id];return s&&s.some(x=>x.reps||x.weight||x.seconds);}).length;
  return std+cust;
}
function totalCount(){
  const w=getWD();if(!w)return 0;
  return getLevelExercises(w.exercises).length+(ST.cur?.customExercises?.length||0);
}
function exportCSV(){
  const exMap=Object.fromEntries(allExs().map(e=>[e.id,e.name]));
  const rows=['Date,Goal,Workout,Gym,Exercise,Set,Reps,Weight(lb),Seconds'];
  for(const s of ST.sessions){
    if(!s.sets)continue;
    const gd=WK[s.goal||'strength'];
    const wDef=gd?.[s.key]?.[s.gymUsed==='commercial'?'commercial':s.hotelOpt||'hotel1'];
    const wName=wDef?.name||(s.key||'?');
    const date=new Date(s.started).toLocaleDateString('en-US');
    for(const[exId,sets]of Object.entries(s.sets)){
      const name=exMap[exId]||exId.replace('c_','[Custom] ');
      sets.forEach((st,i)=>{
        if(!st.reps&&!st.weight&&!st.seconds)return;
        rows.push([date,s.goal||'',wName,s.gymUsed||'',name,i+1,st.reps||'',st.weight||'',st.seconds||''].join(','));
      });
    }
  }
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='flight_crew_fitness.csv';a.click();URL.revokeObjectURL(url);
}

function renderExercise(ex,isCustom){
  const exKey=isCustom?'c_'+ex.id:ex.id;
  const isOpen=!!ST.expanded[exKey];
  const timed=isTimed(ex.id,ex.name);

  if(!ST.cur.sets[exKey]){
    if(timed){
      ST.cur.sets[exKey]=[{seconds:''}];
    } else {
      ST.cur.sets[exKey]=Array.from({length:ex.sets},()=>({reps:'',weight:''}));
    }
  }
  const sets=ST.cur.sets[exKey];
  if(!timed) while(sets.length<ex.sets) sets.push({reps:'',weight:''});

  const hasData=timed?sets.some(s=>s.seconds):sets.some(s=>s.reps||s.weight);
  const card=mk('div','exc');
  const hdr=mk('div','exh');
  hdr.innerHTML=`<div style="flex:1">
    <div class="exn">${ex.name}${isCustom?'<span class="ctag">CUSTOM</span>':''}</div>
    <div class="ext">${ex.target}${timed?' · <span style="color:var(--blue);font-weight:600">⏱ timed</span>':''}</div>
  </div>
  <div class="exr">
    ${!isCustom?`<button class="btn-i" data-info="${exKey}">ℹ Guide</button>`:''}
    ${isCustom?`<button class="delx" data-del="${ex.id}">✕</button>`:''}
    <div class="exck ${hasData?'done':''}">${hasData?'✓':''}</div>
    <div class="excv ${isOpen?'open':''}">⌄</div>
  </div>`;

  if(!isCustom){
    hdr.querySelector('[data-info]').onclick=ev=>{
      ev.stopPropagation();
      ST.modal={id:ex.id,name:ex.name,ref:ex.ref};render();
    };
  } else {
    hdr.querySelector('[data-del]').onclick=ev=>{
      ev.stopPropagation();
      if(!confirm(`Remove "${ex.name}"?`))return;
      ST.cur.customExercises=ST.cur.customExercises.filter(x=>x.id!==ex.id);
      delete ST.cur.sets['c_'+ex.id];
      saveCur();render();
    };
  }
  hdr.onclick=ev=>{
    if(ev.target.closest('[data-info],[data-del]'))return;
    ST.expanded[exKey]=!ST.expanded[exKey];render();
  };
  card.appendChild(hdr);

  if(isOpen){
    const body=mk('div','exb');

    if(timed){
      const lw=lastTime(exKey);
      if(lw) {const r=mk('div','rw');r.innerHTML=`⏱ Last best: <strong>${lw}s</strong> — try to beat it`;body.appendChild(r);}
      const box=mk('div','timed-box'+(sets[0]?.seconds?' ok':''));
      box.innerHTML=`<div class="timed-lbl">Total Time</div>`;
      const inp=document.createElement('input');
      inp.type='number';inp.className='timed-inp';inp.placeholder='0';
      inp.value=sets[0]?.seconds||'';inp.setAttribute('inputmode','numeric');
      inp.onchange=inp.onblur=()=>{
        sets[0]={seconds:inp.value};
        box.className='timed-box'+(inp.value?' ok':'');
        saveCur();
      };
      const hint=mk('div','timed-hint');hint.textContent='seconds';
      box.appendChild(inp);box.appendChild(hint);body.appendChild(box);
    } else {
      const lw=lastWt(exKey);
      if(lw!==null){const r=mk('div','rw');r.innerHTML=`📊 Last max: <strong>${lw} lb</strong> — match or beat it`;body.appendChild(r);}
      const scroll=mk('div','ss');
      sets.forEach((s,i)=>{
        const tile=mk('div','st'+(s.reps||s.weight?' ok':''));
        tile.innerHTML=`<div class="sl">Set ${i+1}</div>`;
        const ri=document.createElement('input');
        ri.type='number';ri.className='si';ri.placeholder='Reps';ri.value=s.reps||'';ri.setAttribute('inputmode','numeric');
        ri.onchange=ri.onblur=()=>{sets[i].reps=ri.value;tile.className='st'+(ri.value||sets[i].weight?' ok':'');saveCur();};
        const wi=document.createElement('input');
        wi.type='number';wi.className='si';wi.placeholder='lb';wi.value=s.weight||'';wi.setAttribute('inputmode','decimal');
        wi.onchange=wi.onblur=()=>{sets[i].weight=wi.value;tile.className='st'+(sets[i].reps||wi.value?' ok':'');saveCur();};
        const hint=mk('div','sh');hint.textContent='reps / lb';
        tile.appendChild(ri);tile.appendChild(wi);tile.appendChild(hint);
        scroll.appendChild(tile);
      });
      body.appendChild(scroll);
      const hint2=mk('div','ssh');hint2.textContent='← swipe for all sets';body.appendChild(hint2);
    }
    card.appendChild(body);
  }
  return card;
}

  const pills=mk('div','pills');let any=false;
  for(const ex of allExs()){
    const td=trendPts(ex.id);if(!td.length)continue;any=true;
    const p=mk('div','pill'+(ST.trendEx===ex.id?' active':''));
    p.textContent=ex.name;p.onclick=()=>{ST.trendEx=ex.id;render();};pills.appendChild(p);
  }
  if(any) page.appendChild(pills);
  if(ST.trendEx){
    const td=trendPts(ST.trendEx);
    if(td.length){
      const ex=allExs().find(e=>e.id===ST.trendEx);
      const useTime=td.every(d=>d.maxT>0&&d.maxW===0);
      const latest=td[td.length-1],first=td[0];
      const val=useTime?'maxT':'maxW';
      const gain=Math.round(latest[val]-first[val]);
      const cc=mk('div','card');
      cc.innerHTML=`<div class="fb mb8">
        <div style="font-weight:600;font-size:15px">${ex?.name||ST.trendEx}</div>
        ${gain!==0?`<div style="font-size:13px;font-weight:600;color:${gain>0?'var(--green)':'var(--red)'}">${gain>0?'+':''}${gain}${useTime?'s':' lb'}</div>`:''}
      </div>
      <div class="cw"><canvas id="tc"></canvas></div>
      <div class="sstrip" style="margin-top:12px;margin-bottom:0">
        <div class="sbox"><div class="sv">${latest[val]}</div><div class="slb">${useTime?'Best Secs':'Max lb'}</div></div>
        <div class="sbox"><div class="sv">${td.length}</div><div class="slb">Sessions</div></div>
        <div class="sbox"><div class="sv">${latest.vol||'—'}</div><div class="slb">Last Volume</div></div>
      </div>`;
      page.appendChild(cc);
    }
  }
}

function renderBodyTrend(page){
  const logCard=mk('div','card mb8');
  logCard.innerHTML=`<div style="font-weight:600;font-size:14px;margin-bottom:12px">Log Body Metrics</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <div class="fld" style="margin-bottom:0"><label>Weight (lb)</label>
        <input type="number" id="wt_inp" inputmode="decimal" placeholder="232" value="${ST.newWt||''}"></div>
      <div class="fld" style="margin-bottom:0"><label>Waist (in)</label>
        <input type="number" id="wst_inp" inputmode="decimal" placeholder="38.5" value="${ST.newWaist||''}"></div>
    </div>
    <button class="btn btn-g" onclick="logBodyMetrics()">Log</button>`;
  logCard.querySelector('#wt_inp').oninput=e=>ST.newWt=e.target.value;
  logCard.querySelector('#wst_inp').oninput=e=>ST.newWaist=e.target.value;
  page.appendChild(logCard);

  if(!ST.weights.length){
    const e=mk('div','empty');e.innerHTML='<div style="font-size:44px;margin-bottom:12px">⚖️</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">No metrics logged yet</div>';
    page.appendChild(e);return;
  }

  const latest=ST.weights[ST.weights.length-1];
  const first=ST.weights[0];

  if(ST.weights.some(w=>w.weight)){
    const dW=Math.round((latest.weight-first.weight)*10)/10;
    const wc=mk('div','card mb8');
    wc.innerHTML=`<div class="fb mb8">
      <div style="font-weight:600;font-size:15px">Body Weight</div>
      ${dW!==0?`<div style="font-size:13px;font-weight:600;color:${dW<0?'var(--green)':'var(--red)'}">${dW>0?'+':''}${dW} lb</div>`:''}
    </div>
    <div class="cw"><canvas id="wc"></canvas></div>
    <div class="sstrip" style="margin-top:12px;margin-bottom:0">
      <div class="sbox"><div class="sv">${latest.weight||'—'}</div><div class="slb">Current lb</div></div>
      <div class="sbox"><div class="sv">${first.weight||'—'}</div><div class="slb">Start lb</div></div>
      <div class="sbox"><div class="sv">${ST.weights.length}</div><div class="slb">Entries</div></div>
    </div>`;
    page.appendChild(wc);
  }

  const waistData=ST.weights.filter(w=>w.waist);
  if(waistData.length>0){
    const lW=waistData[waistData.length-1];const fW=waistData[0];
    const dWaist=Math.round((lW.waist-fW.waist)*10)/10;
    const wc2=mk('div','card');
    wc2.innerHTML=`<div class="fb mb8">
      <div style="font-weight:600;font-size:15px">Waist Measurement</div>
      ${dWaist!==0?`<div style="font-size:13px;font-weight:600;color:${dWaist<0?'var(--green)':'var(--red)'}">${dWaist>0?'+':''}${dWaist} in</div>`:''}
    </div>
    <div class="cw"><canvas id="wc2"></canvas></div>
    <div class="sstrip" style="margin-top:12px;margin-bottom:0">
      <div class="sbox"><div class="sv">${lW.waist||'—'}</div><div class="slb">Current in</div></div>
      <div class="sbox"><div class="sv">${fW.waist||'—'}</div><div class="slb">Start in</div></div>
      <div class="sbox"><div class="sv">${waistData.length}</div><div class="slb">Entries</div></div>
    </div>`;
    page.appendChild(wc2);
  }
}

async function logBodyMetrics(){
  const wt=parseFloat(ST.newWt);
  const waist=parseFloat(ST.newWaist)||null;
  if(!wt||wt<50||wt>500){alert('Enter a valid weight.');return;}
  await dbLogWeight(wt,waist);
  ST.weights=await dbGetWeights();
  ST.newWt='';ST.newWaist='';render();
}

function renderHistory(page){
  if(!ST.sessions.length){
    const e=mk('div','empty');e.innerHTML='<div style="font-size:44px;margin-bottom:12px">📋</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">No sessions yet</div>';
    page.appendChild(e);return;
  }
  page.appendChild(lbl('Recent Sessions'));
  [...ST.sessions].reverse().slice(0,25).forEach(s=>{
    const gd=WK[s.goal||'strength'];
    const color=gd?.color||'#2f6eb5';
    const wDef=gd?.[s.key]?.[s.gymUsed==='commercial'?'commercial':s.hotelOpt||'hotel1'];
    const wName=wDef?.name||s.key;
    const date=new Date(s.started).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const exCnt=Object.values(s.sets||{}).filter(sets=>sets.some(x=>x.reps||x.weight||x.seconds)).length;
    const it=mk('div','hi');
    it.innerHTML=`<div>
      <div style="font-weight:600;font-size:14px;border-left:3px solid ${color};padding-left:8px">${wName}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${date} · ${exCnt} exercises · ${s.gymUsed==='commercial'?'Commercial':'Hotel'}</div>
    </div>
    <div class="hbg" style="background:${color}22;color:${color}">${s.key||'?'}</div>`;
    page.appendChild(it);
  });
}

function drawChart(id,labels,data,yLabel){
  const canvas=document.getElementById(id);if(!canvas)return;
  if(id==='tc'){if(chartInst){chartInst.destroy();chartInst=null;}}
  const inst=new Chart(canvas.getContext('2d'),{
    type:'line',
    data:{labels,datasets:[{label:yLabel,data,borderColor:'#c9a84c',backgroundColor:'rgba(201,168,76,0.12)',tension:0.35,fill:true,pointBackgroundColor:'#c9a84c',pointRadius:5,pointHoverRadius:7}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#888',maxRotation:45}},
              y:{grid:{color:'#f0ede8'},ticks:{font:{size:10},color:'#888'}}}},
  });
  if(id==='tc') chartInst=inst;
}

// ─── USER DATA PROFILE SETTINGS ───────────────────────────────────────────────
function renderProfile(page){
  const p=ST.profile;
  const editing=ST.profEdit||!p;
  const goal=p?GOALS.find(g=>g.id===p.goal):null;

  if(!editing&&p){
    const hero=mk('div','phero');
    hero.innerHTML=`<div style="font-size:44px;margin-bottom:8px">${goal?.icon||'✈'}</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);letter-spacing:0.06em">${p.name||'Flight Crew'}</div>
      <div style="font-size:12px;color:#8899aa;margin-top:3px">Age ${p.age||'—'} · ${p.weight||'—'} lb · Waist ${p.waist||'—'}" · ${p.level||'Intermediate'}</div>`;
    page.appendChild(hero);

    const gc=mk('div','card');
    gc.innerHTML=`<div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em">Goal</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="font-size:32px">${goal?.icon||'🏋️'}</div>
        <div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.04em">${goal?.label||'—'}</div>
          <div style="font-size:12px;color:var(--muted)">${goal?.sub||''}</div>
        </div>
      </div>`;
    page.appendChild(gc);

    const ss=mk('div','sstrip');
    ss.innerHTML=`<div class="sbox"><div class="sv">${p.age||'—'}</div><div class="slb">Age</div></div>
      <div class="sbox"><div class="sv">${p.weight||'—'}</div><div class="slb">Weight lb</div></div>
      <div class="sbox"><div class="sv">${ST.sessions.length}</div><div class="slb">Sessions</div></div>`;
    page.appendChild(ss);

    const lvlNote=mk('div','note gld');
    const ll=LEVEL_LIMIT[p.level||'intermediate'];
    lvlNote.innerHTML=`<strong>${p.level||'Intermediate'}</strong> level — you'll see ${ll} exercises per workout. Change anytime in Edit Profile.`;
    page.appendChild(lvlNote);

    const eb=mk('button','btn btn-o mt8');eb.textContent='Edit Profile';
    eb.onclick=()=>{ST.profEdit=true;render();};page.appendChild(eb);

    const dz=mk('div','card mt16');
    dz.innerHTML='<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em">Account</div>';
    const so=mk('button','btn btn-red btn-sm');so.textContent='Sign Out';so.onclick=doSignOut;
    dz.appendChild(so);page.appendChild(dz);
    return;
  }

  const draft=ST.profDraft||(p?{...p}:{name:'',age:'',weight:'',waist:'',level:'intermediate',goal:'strength'});
  ST.profDraft=draft;

  if(!p){
    const wc=mk('div','card mb8');
    wc.innerHTML=`<div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--navy);letter-spacing:0.04em;margin-bottom:4px">Welcome, Flight Crew</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.5">Set up your profile to get a personalized workout plan. Takes 60 seconds.</div>`;
    page.appendChild(wc);
  }

  const ic=mk('div','card');
  ic.innerHTML=`<div class="shdr" style="margin-top:0">About You</div>
    <div class="fld"><label>Name / Callsign (optional)</label><input type="text" id="p_name" value="${draft.name||''}" placeholder="Name or callsign"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fld"><label>Age</label><input type="number" id="p_age" inputmode="numeric" value="${draft.age||''}" placeholder="e.g. 42"></div>
      <div class="fld"><label>Weight (lb)</label><input type="number" id="p_wt" inputmode="decimal" value="${draft.weight||''}" placeholder="e.g. 185"></div>
    </div>
    <div class="fld"><label>Waist (inches)</label><input type="number" id="p_waist" inputmode="decimal" value="${draft.waist||''}" placeholder="e.g. 36.5"></div>`;
  page.appendChild(ic);
  ic.querySelector('#p_name').oninput=e=>draft.name=e.target.value;
  ic.querySelector('#p_age').oninput=e=>draft.age=e.target.value;
  ic.querySelector('#p_wt').oninput=e=>draft.weight=e.target.value;
  ic.querySelector('#p_waist').oninput=e=>draft.waist=e.target.value;

  const lvc=mk('div','card');
  lvc.innerHTML='<div class="shdr" style="margin-top:0">Fitness Level</div><div style="font-size:12px;color:var(--muted);margin-bottom:10px">Controls how many exercises you see per workout: Beginner=3, Intermediate=4, Advanced=5</div>';
  const lvg=mk('div','g3');
  [{id:'beginner',l:'Beginner'},{id:'intermediate',l:'Intermediate'},{id:'advanced',l:'Advanced'}].forEach(lv=>{
    const b=mk('div','lvl'+(draft.level===lv.id?' sel':''));
    b.textContent=lv.l;
    b.onclick=()=>{draft.level=lv.id;document.querySelectorAll('.lvl').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
    lvg.appendChild(b);
  });
  lvc.appendChild(lvg);page.appendChild(lvc);

  const gc2=mk('div','card');
  gc2.innerHTML='<div class="shdr" style="margin-top:0">Training Goal</div>';
  const gg2=mk('div','');gg2.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px';
  GOALS.forEach(g=>{
    const b=mk('div','gcrd'+(draft.goal===g.id?' sel':''));
    b.innerHTML=`<div class="gi">${g.icon}</div><div class="gl">${g.label}</div><div class="gs">${g.sub}</div>`;
    b.onclick=()=>{draft.goal=g.id;document.querySelectorAll('.gcrd').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
    gg2.appendChild(b);
  });
  gc2.appendChild(gg2);page.appendChild(gc2);

  const sv=mk('button','btn btn-g mt8');
  sv.textContent=p?'Save Changes':'Build My Program →';
  sv.onclick=async()=>{
    if(!draft.goal){alert('Please select a training goal.');return;}
    ST.profile={...draft};
    await dbSetProfile(ST.profile);
    if(draft.weight&&parseFloat(draft.weight)>0)
      if(!p||draft.weight!==p.weight||draft.waist!==p.waist)
        await dbLogWeight(parseFloat(draft.weight),parseFloat(draft.waist)||null);
    ST.profEdit=false;ST.profDraft=null;
    if(p?.goal!==draft.goal){ST.cur=null;await startNext();}
    render();
  };
  page.appendChild(sv);
  if(p){const cn=mk('button','btn btn-o mt8');cn.textContent='Cancel';cn.onclick=()=>{ST.profEdit=false;ST.profDraft=null;render();};page.appendChild(cn);}
}

  const isUp=ST.authMode==='signup';

    <div style="text-align:center;padding:0 0 32px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--navy);letter-spacing:0.08em">✈ FLIGHT CREW FITNESS</div>

      <div class="fld"><label>Email</label><input type="email" id="ae" value="${ST.authEmail}" placeholder="your@email.com" autocomplete="email"></div>
      <div class="fld"><label>Password</label><input type="password" id="ap" value="${ST.authPass}" placeholder="${isUp?'Choose a password':'Password'}" autocomplete="${isUp?'new-password':'current-password'}"></div>
      <div class="emsg${ST.authErr?' on':''}">${ST.authErr}</div>
      <button class="btn btn-p mt12" id="asub">${isUp?'Create Account':'Sign In'}</button>

  document.getElementById('ae').oninput=ev=>ST.authEmail=ev.target.value;

// ─── RUNTIME ENGINE UTILS ─────────────────────────────────────────────────────
function mk(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function lbl(txt){const e=mk('div','shdr');e.textContent=txt;return e;}

window.onerror=function(msg,src,line,col,err){
  var app=document.getElementById('app');
  if(app) app.innerHTML='<div style="padding:40px 24px;font-family:sans-serif;color:#0d1b2a;text-align:center">'+
    '<div style="font-size:28px;margin-bottom:12px">&#x2708;</div>'+
    '<div style="font-size:16px;font-weight:600;margin-bottom:8px">Something went wrong</div>'+
    '<div style="background:#fff0ee;border:1px solid #fcc;border-radius:8px;padding:12px;font-size:12px;color:#8a1a1a;margin:0 auto 20px;max-width:300px;text-align:left">'+
    msg+'<br><small>'+src+' line '+line+'</small></div>'+
    '<button onclick="location.reload()" style="padding:12px 24px;background:#0d1b2a;color:#c9a84c;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">Reload</button></div>';
  return false;
};
try{init();}catch(err){
  document.getElementById('app').innerHTML='<div style="padding:40px 24px;font-family:sans-serif;color:#0d1b2a;text-align:center">'+
    '<div style="font-size:28px;margin-bottom:12px">&#x2708;</div>'+
    '<div style="font-size:16px;font-weight:600;margin-bottom:8px">Startup Error</div>'+
    '<div style="font-size:13px;color:#666;margin-bottom:20px">'+err.message+'</div>'+
    '<button onclick="location.reload()" style="padding:12px 24px;background:#0d1b2a;color:#c9a84c;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">Reload</button></div>';
}
